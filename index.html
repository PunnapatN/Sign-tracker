<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตรวจป้าย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Lotuss Smart HL";font-weight:300;font-display:swap;src:url(fonts/LotussSmartHL-Light.woff2) format("woff2"),url(fonts/LotussSmartHL-Light.ttf) format("truetype"),url(fonts/LotussSmartHL-Light.otf) format("opentype")}
@font-face{font-family:"Lotuss Smart HL";font-weight:400;font-display:swap;src:url(fonts/LotussSmartHL-Regular.woff2) format("woff2"),url(fonts/LotussSmartHL-Regular.ttf) format("truetype"),url(fonts/LotussSmartHL-Regular.otf) format("opentype")}
@font-face{font-family:"Lotuss Smart HL";font-weight:500;font-display:swap;src:url(fonts/LotussSmartHL-Medium.woff2) format("woff2"),url(fonts/LotussSmartHL-Medium.ttf) format("truetype"),url(fonts/LotussSmartHL-Medium.otf) format("opentype")}
@font-face{font-family:"Lotuss Smart HL";font-weight:700;font-display:swap;src:url(fonts/LotussSmartHL-Bold.woff2) format("woff2"),url(fonts/LotussSmartHL-Bold.ttf) format("truetype"),url(fonts/LotussSmartHL-Bold.otf) format("opentype")}
@font-face{font-family:"Lotuss Smart HL";font-weight:800;font-display:swap;src:url(fonts/LotussSmartHL-ExtraBold.woff2) format("woff2"),url(fonts/LotussSmartHL-ExtraBold.ttf) format("truetype"),url(fonts/LotussSmartHL-ExtraBold.otf) format("opentype")}
:root{
  /* ธีมแบรนด์ตามคู่มือ Corporate Brand Colors: Lotus's Green #00BCB4 (Pantone 3262 C), Lotus's Yellow #F9BE00 (Pantone 7408 C)
     --lotus-d / --lotus-dd เป็นเฉดเข้มของ Lotus's Green สำหรับพื้นหลังที่มีตัวอักษรสีขาว เพื่อให้อ่านง่าย */
  --sun:#F9BE00; --sun-d:#DDA800; --sun-l:#FEF3C7;
  --lotus:#00BCB4; --lotus-d:#007A74; --lotus-dd:#004F4B; --lotus-l:#E0F7F6;
  --makro:#D7262E; --makro-d:#A81920; --makro-l:#FDE8E9;
  --ink:#152320; --ink2:#4A5E5A; --muted:#7D8F8B; --paper:#F4F7F6; --card:#fff; --line:#DCE5E3;
  --pylon:#1C2725;
  --ok:#0E6B3A; --ok-bg:#D9F2E3; --warn:#8A3F00; --warn-bg:#FFE3C7; --bad:#B0161E; --bad-bg:#FCDDDE;
  --fill:#1D4EA8; --fill-bg:#DCE7FF; --none:#5D6B68; --none-bg:#E5EBE9;
  --r:14px; --font:"Lotuss Smart HL","IBM Plex Sans Thai",Tahoma,sans-serif;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 16px;min-height:44px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover{border-color:#b9c9c6}
button.pri{background:var(--lotus-d);border-color:var(--lotus-d);color:#fff}
button.pri:hover{background:var(--lotus-dd);border-color:var(--lotus-dd)}
button.sun{background:var(--sun);border-color:var(--sun);color:var(--lotus-dd);font-weight:700}
button.sun:hover{background:var(--sun-d);border-color:var(--sun-d)}
button.dan{color:var(--makro);border-color:#f2b8bb}
button:disabled{opacity:.45;cursor:default}
button svg{width:18px;height:18px;flex:none}
:focus-visible{outline:3px solid var(--lotus);outline-offset:2px}
input,select,textarea{border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;width:100%;min-height:44px}
input:focus,select:focus{border-color:var(--lotus);outline:none;box-shadow:0 0 0 3px var(--sun-l)}
label{display:block;font-size:14px;color:var(--ink2);margin:12px 0 4px;font-weight:500}
a{color:var(--lotus-d);font-weight:500}
/* แถบบน */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--lotus-dd);color:#fff;border-bottom:4px solid var(--sun)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--lotus-dd);z-index:30}
.hbar{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1120px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand b{font-weight:800;font-size:20px;letter-spacing:.2px;white-space:nowrap}
.mark{width:24px;height:24px;flex:none;background:var(--lotus);border-radius:50% 50% 0 50%;transform:rotate(45deg);display:flex;align-items:center;justify-content:center}
.mark::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--sun)}
.mark i{display:none}
.mark i{height:7px;border-radius:1px;background:var(--lotus)}.mark i:nth-child(2){background:#fff}.mark i:nth-child(3){background:var(--sun)}
.who{font-size:13px;opacity:.85;text-align:right;line-height:1.25;max-width:45vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{background:transparent;border:1.5px solid rgba(255,255,255,.3);color:#fff;min-height:38px;padding:6px 10px}
.iconbtn:hover{border-color:#fff}
/* เมนู: บนจอใหญ่เป็นแถบ บนมือถือเป็นแถบล่าง */
nav{display:flex;gap:4px;max-width:1120px;margin:0 auto;padding:0 12px 10px}
nav a{display:flex;align-items:center;gap:6px;color:#bfe3df;text-decoration:none;padding:7px 14px;border-radius:999px;font-weight:500;position:relative}
nav a svg{width:22px;height:22px}
nav a.on{background:var(--sun);color:var(--lotus-dd);font-weight:700}
nav .n{background:var(--sun);color:var(--lotus-dd);border-radius:999px;padding:0 6px;font-size:12px;font-weight:700;min-width:20px;text-align:center;line-height:18px}
@media(max-width:720px){
  nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;max-width:none}
  nav a{flex-direction:column;gap:2px;font-size:12px;color:var(--ink2);padding:6px 4px;border-radius:12px;flex:1;max-width:100px}
  nav a.on{background:var(--sun-l);color:var(--lotus-dd);font-weight:700}
  nav a.on::before{content:"";position:absolute;top:-7px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--sun)}
  nav a .n{background:var(--sun)}
  nav .n{position:absolute;top:2px;right:calc(50% - 22px)}
  main{padding-bottom:96px!important}
  .who{display:none}
}
main{max-width:1120px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:26px;font-weight:800;margin:4px 0 14px;line-height:1.2}
h2{font-size:19px;font-weight:700;margin:26px 0 10px}
.crumb{font-size:14px;display:inline-flex;align-items:center;gap:4px;margin-bottom:4px;text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.muted{color:var(--muted);font-size:14px}
.red{color:var(--bad);font-weight:700}
.num{text-align:right;font-variant-numeric:tabular-nums}
/* ภาพรวม: แถบสุขภาพป้าย */
.hero{background:var(--lotus-dd);color:#fff;border-radius:18px;padding:18px 18px 16px;margin-bottom:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-34px;bottom:-60px;width:150px;height:150px;border-radius:50% 50% 0 50%;transform:rotate(45deg);background:var(--lotus);opacity:.35}
.hero>*{position:relative;z-index:1}
.hero .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero .t b{font-size:15px;font-weight:500;opacity:.85}
.hero .t span{font-size:14px;opacity:.75}
.hero .big{font-size:40px;font-weight:800;line-height:1.1;margin:6px 0 12px;color:var(--sun)}
.hero .big small{font-size:16px;font-weight:400;color:#fff;opacity:.85;margin-left:6px}
.health{display:flex;height:14px;border-radius:999px;overflow:hidden;background:#2a3b38;gap:2px}
.health i{display:block;height:100%;min-width:3px}
.hero .health{height:20px;background:rgba(255,255,255,.12)}
.bcard .health,.card .health{background:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.h-ok{background:#2BB673}.h-warn{background:#F08A24}.h-bad{background:var(--makro)}.h-empty{background:#fff;box-shadow:inset 0 0 0 1px #9aa}.h-fill{background:#5B8DEF}.h-none{background:#8C9A97}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;border-left:5px solid var(--line)}
.kpi span{display:block;font-size:13px;color:var(--ink2)}
.kpi b{font-size:28px;font-weight:800;line-height:1.2}
.kpi.alert{border-left-color:var(--makro)}.kpi.alert b{color:var(--makro)}
.kpi.good{border-left-color:var(--lotus)}
.kpi.info{border-left-color:var(--sun)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{max-width:260px}
.toolbar select{max-width:240px}
/* การ์ดสาขา */
.blist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.bcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;text-align:left;width:100%;display:block;min-height:0;font-weight:400}
.bcard:hover{border-color:var(--sun);box-shadow:0 0 0 3px var(--sun-l)}
.bcard .top{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
.bcard .code{font-size:13px;color:var(--muted)}
.bcard .name{font-size:18px;font-weight:700;line-height:1.25}
.bcard .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px;text-align:center}
.bcard .stats div{background:var(--paper);border-radius:10px;padding:6px 2px}
.bcard .stats b{display:block;font-size:18px;font-weight:800}
.bcard .stats span{font-size:12px;color:var(--ink2)}
.bcard .stats .hot b{color:var(--makro)}
.prog{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:10px}.prog i{display:block;height:100%;background:var(--sun)}
.fmt{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap}
.fmt-lotus{background:var(--lotus-l);color:var(--lotus-d)}.fmt-makro{background:var(--makro-l);color:var(--makro-d)}.fmt-talad{background:#FFF3D6;color:#7A4D00}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-weight:500;color:var(--ink2);font-size:13px;border-bottom:1px solid var(--line);padding:8px 6px}
.tbl td{border-bottom:1px solid #EDF2F1;padding:10px 6px;vertical-align:top}
.scroll{overflow-x:auto}
.chip{display:inline-block;border-radius:8px;padding:2px 9px;font-size:13px;font-weight:500;white-space:nowrap}
.c-ok{background:var(--ok-bg);color:var(--ok)}.c-warn{background:var(--warn-bg);color:var(--warn)}
.c-bad{background:var(--bad-bg);color:var(--bad)}.c-fill{background:var(--fill-bg);color:var(--fill)}
.c-none{background:var(--none-bg);color:var(--none)}.c-empty{background:#fff;color:var(--ink);border:1.5px dashed var(--ink2)}
/* ผังป้าย */
.pylon{display:inline-block;background:var(--pylon);border-radius:10px 10px 3px 3px;padding:10px;max-width:100%;border-top:6px solid var(--sun)}
.pylon .head{color:#A7DCD6;font-size:13px;padding:0 2px 8px;display:flex;justify-content:space-between;gap:10px;font-weight:500}
.pgrid{display:grid;gap:5px}
.tile{min-width:78px;min-height:52px;border-radius:5px;padding:5px 7px;font-size:12px;line-height:1.3;border:0;text-align:left;display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;overflow:hidden;font-weight:500}
.tile b{font-weight:800;font-size:11px;opacity:.7}
.tile.empty{background:#fff;color:#556;box-shadow:0 0 0 1px #fff,0 0 14px 3px rgba(255,255,255,.5)}
.tile.cur{outline:3px solid #FFD54A;outline-offset:2px}
.tile.skip{background:transparent;border:1px dashed #45524F}
.legs{display:flex;justify-content:space-around;height:18px}.legs i{width:14px;background:var(--pylon)}
.pt{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
@media(max-width:640px){.pt{grid-template-columns:1fr}}
.pinfo b{font-size:18px;font-weight:700}
.status-line{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.step{font-size:14px;color:var(--lotus-d);font-weight:700}
.stepbar{display:flex;gap:4px;margin:6px 0 12px}.stepbar i{flex:1;height:5px;border-radius:999px;background:var(--line)}.stepbar i.on{background:var(--sun)}
/* ส่วนประกอบอื่น */
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:60;max-width:90vw;font-weight:500}
.modal{position:fixed;inset:0;background:rgba(8,26,23,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal .box{background:#fff;border-radius:20px 20px 0 0;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:721px){.modal{align-items:center;padding:16px}.modal .box{border-radius:20px}}
.modal.full{padding:0;background:#000;align-items:stretch}
.cam{position:relative;width:100vw;height:100vh;height:100dvh;display:flex;flex-direction:column}
.cam video{flex:1;width:100%;object-fit:contain;background:#000;min-height:0}
.cam-label{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;color:#fff;background:rgba(0,70,63,.8);padding:8px 12px;border-radius:12px;font-size:15px;font-weight:500;border-left:4px solid var(--sun)}
.cam-frame{position:absolute;inset:18% 8% 26%;border:2px dashed rgba(255,255,255,.55);border-radius:12px;pointer-events:none}
.cam-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 22px calc(16px + env(safe-area-inset-bottom,0px));background:#000}
.cam-bar button{background:transparent;color:#fff;border-color:#555}
.shutter{width:74px;height:74px;border-radius:50%!important;background:#fff!important;border:6px solid var(--sun)!important;padding:0}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumbs figure{margin:0;font-size:13px;color:var(--ink2)}
.thumbs img{width:156px;height:116px;object-fit:cover;border-radius:10px;background:#eee;display:block;margin-bottom:4px}
.empty-state{text-align:center;padding:34px 12px;color:var(--ink2)}
.check{display:flex;gap:8px;align-items:center;font-size:15px;margin:6px 14px 6px 0;font-weight:400;color:var(--ink)}
.check input{width:20px;height:20px;min-height:0;accent-color:var(--lotus)}
details summary{cursor:pointer}
/* ตัวกรอง + ผู้ใช้ */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters select{flex:1;min-width:150px;max-width:280px}
button.ghost{border-color:transparent;background:transparent;color:var(--lotus-d)}
.rolebar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.rolepill{border-radius:999px;min-height:38px;padding:6px 14px;white-space:nowrap;font-weight:500}
.rolepill b{font-weight:800;margin-left:2px}
.rolepill.on{background:var(--sun);border-color:var(--sun);color:var(--lotus-dd)}
.rdot{width:10px;height:10px;border-radius:50%;display:inline-block}
.ulist{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px;margin-bottom:8px}
@media(max-width:420px){.ulist{grid-template-columns:1fr}}
.ucard{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.ucard.off{opacity:.6}
.av{width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;flex:none;font-size:18px}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rchip{display:inline-block;border-radius:999px;padding:1px 10px;font-size:12px;font-weight:700;white-space:nowrap}
.rs{background:var(--lotus-dd);color:var(--sun)}.rv{background:#3D4A7A;color:#fff}.rr{background:var(--lotus-d);color:#fff}.ra{background:var(--lotus-d);color:#fff}.rmg{background:var(--sun-l);color:#6B4E00;box-shadow:inset 0 0 0 1px #F0D78A}.rb{background:var(--none-bg);color:var(--none)}
.rdot.rb{background:#8C9A97}
.perm td,.perm th{text-align:center;font-size:13px}.perm td:first-child{text-align:left;font-size:14px;min-width:170px}
.perm td.yes{color:var(--ok);font-weight:500}.perm td.no{color:#b8c4c1}
.roles{display:grid;gap:6px}
.ropt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin:0;cursor:pointer;color:var(--ink)}
.ropt input{width:20px;height:20px;min-height:0;margin-top:2px;accent-color:var(--lotus)}
.ropt span{display:flex;flex-direction:column}.ropt small{color:var(--muted);font-weight:400;font-size:13px}
.ropt:has(input:checked){border-color:var(--lotus);background:var(--lotus-l)}
/* หน้าเข้าสู่ระบบ */
.login-wrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;background:var(--lotus);position:relative;overflow:hidden}
.login-wrap::before{content:"";position:absolute;right:-140px;top:-60px;width:340px;height:340px;border-radius:50% 50% 0 50%;transform:rotate(45deg);background:var(--sun)}
.login-top,.login-card{position:relative;z-index:1}
.login-top{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px 20px;color:#fff;text-align:center}
.login-top h1{font-size:36px;font-weight:800;color:#fff;margin:18px 0 6px;text-shadow:0 1px 2px rgba(0,60,57,.35)}
.login-top p{margin:0;color:var(--lotus-dd);font-weight:500;font-size:17px}
.login-card{background:#fff;border-radius:24px 24px 0 0;padding:24px 20px calc(28px + env(safe-area-inset-bottom,0px));max-width:480px;width:100%;margin:0 auto;border-top:5px solid var(--sun)}
.brands{display:flex;justify-content:center;gap:8px;margin-top:14px}
@media(prefers-reduced-motion:no-preference){.tile,.bcard{transition:transform .12s,border-color .12s}.tile:active,.bcard:active{transform:scale(.98)}}
</style>
</head>
<body>
<header id="hdr" hidden>
  <div class="hbar"><div class="brand"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><b id="appname">ตรวจป้าย</b></div><div class="who" id="who"></div><button id="logout" class="iconbtn" aria-label="ออกจากระบบ"></button></div>
  <nav id="nav" aria-label="เมนูหลัก"></nav>
</header>
<main id="app"><div class="empty-state">กำลังโหลด…</div></main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script>
"use strict";
/* ================= ค่าคงที่ ================= */
const VERSION = "1.3.2";
/* ===== ตรวจปัญหาการเริ่มระบบ: แสดงสาเหตุบนหน้าจอแทนการค้างที่ "กำลังโหลด" ===== */
let BOOTED=false, BOOTMSG=false;
function bootError(title, detail){
  const a=document.getElementById("app"); if(!a||BOOTMSG) return; BOOTMSG=true;
  a.innerHTML=`<div class="card" style="max-width:640px;margin:30px auto;border-left:5px solid #D7262E"><h2 style="margin-top:0">${title}</h2><p>${detail}</p>

function getGPS(){ return new Promise(res=>{ if(!navigator.geolocation) return res(null); navigator.geolocation.getCurrentPosition(p=>res({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)}),()=>res(null),{enableHighAccuracy:true,timeout:8000,maximumAge:60000}); }); }
function snap(video, maxSide, q, stamp){
  const w=video.videoWidth, h=video.videoHeight, k=Math.min(1,maxSide/Math.max(w,h));
  const c=document.createElement("canvas"); c.width=Math.round(w*k); c.height=Math.round(h*k);
  const x=c.getContext("2d"); x.drawImage(video,0,0,c.width,c.height);
  if(stamp){ const fs=Math.max(14,Math.round(c.width/55)); x.fillStyle="rgba(0,0,0,.6)"; x.fillRect(0,c.height-fs*2.2,c.width,fs*2.2); x.fillStyle="#fff"; x.font=`${fs}px Tahoma,sans-serif`; x.fillText(stamp,fs*.6,c.height-fs*.75); }
  return c.toDataURL("image/jpeg",q);
}
function takePhoto(label){
  return new Promise(async (resolve,reject)=>{
    const m=modal(`<div class="cam"><video playsinline autoplay muted></video><div class="cam-frame" aria-hidden="true"></div><div class="cam-label">${esc(label)}</div><div class="cam-bar"><button data-x>ยกเลิก</button><button class="shutter" data-shot aria-label="ถ่ายภาพ"></button><span style="width:72px"></span></div></div>`,{full:true});
    let stream;
    try{ stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}},audio:false}); }
    catch(e){ m.close(); return reject(new Error("เปิดกล้องไม่ได้ ให้อนุญาตการใช้กล้องในเบราว์เซอร์ แล้วลองอีกครั้ง")); }
    const v=$("video",m.el); v.srcObject=stream; const gpsP=getGPS();
    const stop=()=>stream.getTracks().forEach(t=>t.stop());
    $("[data-x]",m.el).onclick=()=>{ stop(); m.close(); reject(new Error("cancel")); };
    $("[data-shot]",m.el).onclick=async ()=>{
      if(!v.videoWidth) return;
      const at=new Date(); const gps=await gpsP;
      const stamp=`${label} | ${at.toLocaleString("th-TH")}${gps?` | ${gps.lat},${gps.lng}`:" | ไม่มี GPS"}`;
      const full=snap(v,1600,0.82,stamp), thumb=snap(v,320,0.55,null);
      stop(); m.close(); resolve({full,thumb,gps,at});
    };
  });
}

async function zonePriv(z){ if(S.privCache[z]) return S.privCache[z]; const d=await db.doc(`zones/${z}/private/script`).get(); const v=d.exists?d.data():{}; S.privCache[z]=v; return v; }
async function callScript(zoneId, payload){
  const p=await zonePriv(zoneId);
  if(!p.url||!p.key) throw new Error("เขตนี้ยังไม่ได้ตั้งค่าที่เก็บภาพ ให้ AM ไปที่ ตั้งค่า > ที่เก็บภาพของเขต");
  const r=await fetch(p.url,{method:"POST",body:JSON.stringify({...payload,key:p.key})});
  let j; try{ j=await r.json(); }catch(e){ throw new Error("ที่เก็บภาพของเขตตอบกลับไม่ถูกต้อง ตรวจลิงก์ Apps Script"); }
  if(!j.ok) throw new Error(j.error||"อัปโหลดไม่สำเร็จ");
  return j;
}

    run("tickets",q=>q.where("status","in",["open","pending_close"])), run("inspections",q=>q.where("status","==","review"))]);

function scopeLabel(){ const f=S.f; if(f.branch) return "สาขา "+((S.branches[f.branch]||{}).name||f.branch); if(f.zone) return "เขต "+((S.zones[f.zone]||{}).name||f.zone);
  if(f.rm) return "RM "+((S.rms[f.rm]||{}).name||f.rm); if(isRM()) return "RM "+((S.rms[S.me.rmId]||{}).name||""); return wide()?"ทุกเขต":""; }
function ticketState(t){
  const now=Date.now(), due=toDate(t.dueAt), created=toDate(t.createdAt)||new Date(), sla=t.slaDays||1;
  const over=due?Math.floor((now-due.getTime())/86400e3):0, age=(now-created.getTime())/86400e3;
  let lvl=0, txt="อยู่ในกำหนด";
  if(due && now>due.getTime()){ lvl=1; txt="เกินกำหนด แจ้งผู้จัดการศูนย์"; if(age>=sla*2){lvl=2; txt="เกิน 2 เท่า แจ้ง AM";} if(age>=sla*3){lvl=3; txt="เกิน 3 เท่า แจ้ง RM";} }
  return {over:Math.max(0,over), lvl, txt};
}

function exportCSV(slots){

function pylonHTML(p, slots, curKey){
  const t=typeOf(p); const rows=Math.max(p.rows||1,...slots.map(s=>s.row||1)), cols=Math.max(p.cols||1,...slots.map(s=>s.col||1));
  const at={}; slots.forEach(s=>at[`${s.row}-${s.col}`]=s);
  let cells="";
  for(let r=1;r<=rows;r++) for(let c=1;c<=cols;c++){
    const s=at[`${r}-${c}`], key=`${r}-${c}`, cur=curKey===key?" cur":"";
    if(!s){ cells+=`<div class="tile skip${cur}" style="grid-row:${r};grid-column:${c}"></div>`; continue; }
    const cls=COND_CLS[s.condition||"ยังไม่ตรวจ"]||"none";
    cells+=`<button class="tile c-${cls}${cls==="empty"?" empty":""}${cur}" data-slot="${esc(s.id)}" style="grid-row:${r};grid-column:${c}" title="${esc(s.id)}"><b>${String(s.no).padStart(2,"0")}</b><span>${esc(s.tenant|| (cls==="empty"?"ว่าง":"—"))}</span></button>`;
  }
  return `<div style="display:inline-block;max-width:100%"><div class="pylon"><div class="head"><span>${esc(t.name)} ${esc(p.structNo)}${p.side&&p.side!=="-"?" · ฝั่ง "+esc(p.side):""}</span><span>${p.lit?"มีไฟ":""}</span></div>
    <div class="pgrid" style="grid-template-columns:repeat(${cols},minmax(74px,1fr))">${cells}</div></div>${t.legs?'<div class="legs"><i></i><i></i></div>':""}</div>`;
}

function checkGPS(b, gps){
  if(!(b.lat&&b.lng)) return true;
  if(!gps){ toast("ไม่พบตำแหน่ง GPS เปิดการเข้าถึงตำแหน่งแล้วถ่ายใหม่",5000); return isSuper()||isAM(); }
  const d=haversine(b.lat,b.lng,gps.lat,gps.lng);
  if(d>S.settings.gpsRadiusM){ toast(`ตำแหน่งห่างจากสาขา ${Math.round(d)} ม. เกินที่กำหนด ${S.settings.gpsRadiusM} ม.`,5000); return isSuper()||isAM(); }
  return true;
}
function regSlots(app,b,P){
  const cells=[]; for(let r=1;r<=P.rows;r++) for(let c=1;c<=P.cols;c++) cells.push({row:r,col:c});
  let i=0, no=0; const done=[]; let last={w:"",h:"",lit:P.lit};
  const step=()=>{
    if(i>=cells.length) return regSave(app,b,P,done);
    const cell=cells[i], tmp=done.map(d=>({...d,condition:d.ai&&d.ai.category||"ยังไม่ตรวจ"}));
    app.innerHTML=`<h1>ลงทะเบียน ${esc(P.id)}</h1><div class="card"><div class="stepbar"><i class="on"></i><i class="on"></i><i></i></div><div class="step">ขั้นที่ 2 จาก 3 · ช่องที่ตำแหน่ง แถว ${cell.row} คอลัมน์ ${cell.col} (${i+1}/${cells.length})</div>
      <div style="margin:10px 0">${pylonHTML({...P},tmp,`${cell.row}-${cell.col}`)}</div>
      <div class="row"><div class="grow"><label>กว้าง (ซม.)</label><input id="w" type="number" value="${esc(last.w)}"></div><div class="grow"><label>สูง (ซม.)</label><input id="h" type="number" value="${esc(last.h)}"></div></div>
      <label>ชื่อร้าน/แบรนด์ที่เห็นบนป้าย (ไม่ทราบให้เว้นว่าง)</label><input id="tn">
      <label class="check"><input type="checkbox" id="sl" ${last.lit?"checked":""}> ช่องนี้มีไฟ</label>
      <div id="res" class="muted"></div>
      <div class="row" style="margin-top:10px"><button id="skip">ไม่มีช่องตรงนี้</button><span class="grow"></span><button class="pri" id="shot">${IC.cam}ถ่ายภาพช่องนี้</button></div></div>`;
    $("#skip").onclick=()=>{ i++; step(); };
    $("#shot").onclick=async e=>{
      let ph; try{ ph=await takePhoto(`${P.id} แถว${cell.row} คอลัมน์${cell.col}`); }catch(err){ if(err.message!=="cancel") toast(err.message); return; }
      busy(e.target,true,"กำลังอัปโหลดและให้ AI ตรวจ…");
      const sNo=no+1, sid=slotIdOf(P.id,sNo);
      const slot={id:sid, pointId:P.id, branch:b.id, zoneId:b.zoneId, typeCode:P.typeCode, no:sNo, row:cell.row, col:cell.col,
        w:$("#w").value?Number($("#w").value):null, h:$("#h").value?Number($("#h").value):null, lit:$("#sl").checked, tenant:$("#tn").value.trim()};
      try{ const r=await analyzeSlot(slot,"day",ph,{noBaseline:true}); Object.assign(slot,{photo:ph,fileId:r.fileId,url:r.url,ai:r.ai});
        no++; done.push(slot); last={w:$("#w").value,h:$("#h").value,lit:slot.lit};
        if(r.ai&&r.ai.category==="ภาพใช้ไม่ได้"){ toast("AI แจ้งว่าภาพใช้ไม่ได้: "+(r.ai.note||"")+" — บันทึกไว้แล้ว และส่งให้ AM ตรวจ",5000); }
        i++; step();
      }catch(err){ busy(e.target,false); toast(err.message,5000); }
    };
  };
  step();
}

      ops.push([db.doc("thumbs/"+s.id),{zoneId:s.zoneId,branch:s.branch,baseDay:s.photo.thumb,last:s.photo.thumb}]);

async function runInspect(app,p,b,shift){
  const shTH=shift==="day"?"กลางวัน":"กลางคืน", mk=monthKey();
  let ov; try{ ov=await takePhoto(`${p.id} ภาพรวม ${shTH}`); }catch(e){ if(e.message!=="cancel") toast(e.message); return; }
  if(!checkGPS(b,ov.gps)) return;
  app.innerHTML=`<div class="card">กำลังอัปโหลดภาพรวม…</div>`;
  let ovr; try{ ovr=await callScript(p.zoneId,{action:"upload",image:ov.full,branch:p.branch,name:`${p.id}_overview_${shift}`,month:mk}); }catch(e){ toast(e.message,5000); return go("inspect/"+p.id); }
  await db.doc("thumbs/"+p.id).set({zoneId:p.zoneId,branch:p.branch,[shift]:ov.thumb,[shift+"Url"]:ovr.url,[shift+"Month"]:mk},{merge:true});
  const slots=Object.values(S.slots).filter(s=>s.pointId===p.id&&(shift==="day"||s.lit)).sort((a,b)=>a.row-b.row||a.col-b.col);
  let i=0; const results=[];
  const step=()=>{
    if(i>=slots.length) return finish();
    const s=slots[i];
    app.innerHTML=`<h1>${esc(p.id)} · ${shTH}</h1><div class="card"><div class="step">ช่อง ${i+1} จาก ${slots.length} · ${esc(s.id)}</div><div class="prog" style="margin:6px 0 4px"><i style="width:${Math.round(i/slots.length*100)}%"></i></div>
     <div style="margin:10px 0">${pylonHTML(p,Object.values(S.slots).filter(x=>x.pointId===p.id),`${s.row}-${s.col}`)}</div>
     <p>ร้านในทะเบียน: <b>${esc(s.tenant||"-")}</b> · สภาพล่าสุด ${chip(s.condition)}</p>
     <div class="row"><button id="skip">ถ่ายไม่ได้</button><span class="grow"></span><button class="pri" id="shot">${IC.cam}ถ่ายภาพช่องนี้</button></div></div>`;
    $("#skip").onclick=async()=>{ const why=prompt("เหตุผลที่ถ่ายไม่ได้ เช่น มีรถบัง, ป้ายถูกรื้อ"); if(!why) return;
      results.push({s,skip:why}); await db.collection("inspections").add({slotId:s.id,pointId:p.id,branch:s.branch,zoneId:s.zoneId,shift,month:mk,status:"review",kind:"skip",note:why,ai:{},takenBy:S.me.email,takenAt:FV.serverTimestamp()}); i++; step(); };
    $("#shot").onclick=async e=>{
      let ph; try{ ph=await takePhoto(`${s.id} ${shTH}`); }catch(err){ if(err.message!=="cancel") toast(err.message); return; }
      busy(e.target,true,"กำลังอัปโหลดและให้ AI ตรวจ…");
      try{
        const r=await analyzeSlot(s,shift,ph);
        if(r.ai&&r.ai.category==="ภาพใช้ไม่ได้"&&!(await confirmBox(`AI แจ้งว่าภาพใช้ไม่ได้: ${r.ai.note||""} ต้องการบันทึกภาพนี้ไว้หรือไม่ (กดยกเลิกเพื่อถ่ายใหม่)`))){ busy(e.target,false); return; }
        const firstBase=!r.hadBaseline, auto=aiOK(r.ai), now=FV.serverTimestamp();
        const su={lastFileId:r.fileId,lastUrl:r.url,lastInspectedAt:now,updatedAt:now}, tu={zoneId:s.zoneId,branch:s.branch,last:ph.thumb};
        if(firstBase){ if(shift==="day"){su.baseFileIdDay=r.fileId; su.baseUrlDay=r.url; tu.baseDay=ph.thumb;} else {su.baseFileIdNight=r.fileId; su.baseUrlNight=r.url; tu.baseNight=ph.thumb;} }
        if(auto) su.condition="ปกติ";
        const b2=db.batch();
        b2.update(db.doc("slots/"+s.id),su); b2.set(db.doc("thumbs/"+s.id),tu,{merge:true});
        b2.set(db.collection("inspections").doc(),{slotId:s.id,pointId:p.id,branch:s.branch,zoneId:s.zoneId,shift,month:mk,fileId:r.fileId,url:r.url,thumb:ph.thumb,ai:r.ai||{},
          status:auto?"auto":"review",kind:firstBase?"baseline":"monthly",gps:ph.gps||null,takenBy:S.me.email,takenAt:now});
        await b2.commit(); Object.assign(S.slots[s.id],su,{lastInspectedAt:new Date()});
        results.push({s,ai:r.ai,auto}); i++; step();
      }catch(err){ busy(e.target,false); toast(err.message,5000); }
    };
  };
  const finish=async()=>{
    await db.doc("points/"+p.id).update({["lastInspection."+shift]:mk,updatedAt:FV.serverTimestamp()});
    p.lastInspection={...(p.lastInspection||{}),[shift]:mk};
    const rev=results.filter(r=>!r.auto).length;
    app.innerHTML=`<h1>ส่งภาพ ${esc(p.id)} แล้ว</h1><div class="card"><p>${results.length} ช่อง · ปกติ ${results.filter(r=>r.auto).length} · ส่งให้ AM ยืนยัน ${rev}</p>
     ${results.map(r=>`<div class="row" style="border-bottom:1px solid #edf1f0;padding:6px 0"><span class="grow">${esc(r.s.id)}</span>${r.skip?`<span class="chip c-none">ถ่ายไม่ได้</span>`:chip(COND.includes(r.ai.category)?r.ai.category:"ยังไม่ตรวจ")}<span class="muted">${r.ai&&r.ai.note?esc(r.ai.note):""}</span></div>`).join("")}
     <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="pri" id="back">กลับหน้าสาขา</button></div></div>`;
    $("#back").onclick=async()=>{ await loadAll(); go("branch/"+p.branch); };
  };
  step();
}

async function confirmReview(r, finalCond, setBase){
  const s=S.slots[r.slotId]; const now=FV.serverTimestamp(); const b=db.batch();
  b.update(db.doc("inspections/"+r.id),{status:"confirmed",finalCondition:finalCond,reviewedBy:S.me.email,reviewedAt:now});
  if(s){
    const su={condition:finalCond,updatedAt:now};
    if(setBase&&r.fileId){ if(r.shift==="night"){su.baseFileIdNight=r.fileId; su.baseUrlNight=r.url;} else {su.baseFileIdDay=r.fileId; su.baseUrlDay=r.url;} b.set(db.doc("thumbs/"+s.id),{[r.shift==="night"?"baseNight":"baseDay"]:r.thumb,zoneId:s.zoneId,branch:s.branch},{merge:true}); }
    b.update(db.doc("slots/"+s.id),su); Object.assign(s,{condition:finalCond});
    const hasOpen=Object.values(S.tickets).some(t=>t.slotId===s.id&&t.category===finalCond);
    if(!NO_TICKET.includes(finalCond)&&!hasOpen){
      const sla=S.settings.sla[finalCond]||7, ref=db.collection("tickets").doc();

      const r=await analyzeSlot(s,t.shift||"day",ph,{noBaseline:result==="ป้ายทดแทน",expectedTenant:result==="ป้ายทดแทน"?ftn:s.tenant});
      const pass=aiOK(r.ai)||(result==="ป้ายทดแทน"&&r.ai&&!["หลุด/ขาด","ไฟดับทั้งป้าย","ว่าง (ขาวโล่ง)","ภาพใช้ไม่ได้"].includes(r.ai.category));
      const after={afterFileId:r.fileId,afterUrl:r.url,afterAI:r.ai||{},result,afterTenant:ftn||null,closedBy:S.me.email,closedAt:FV.serverTimestamp(),updatedAt:FV.serverTimestamp()};
      Object.assign(t,after,{afterThumb:ph.thumb});

      else { await db.doc("tickets/"+t.id).update({...after,status:"pending_close"}); t.status="pending_close"; toast(`AI ยังเห็นว่า: ${r.ai.category||"-"} ส่งให้ผู้จัดการศูนย์หรือ AM อนุมัติปิด`,5000); }
      m.close(); render();
    }catch(err){ busy(e.target,false); toast(err.message,5000); }
  };
}
async function finalizeClose(t, result, ftn, thumb){
  const s=S.slots[t.slotId]; const now=FV.serverTimestamp(); const b=db.batch();
  b.update(db.doc("tickets/"+t.id),{status:"closed",result,afterFileId:t.afterFileId||null,afterUrl:t.afterUrl||null,afterAI:t.afterAI||{},afterTenant:ftn||null,closedBy:t.closedBy||S.me.email,closedAt:now,updatedAt:now});
  if(s){
    const su={condition:result,updatedAt:now}, night=t.shift==="night";
    if(t.afterFileId){ su.lastFileId=t.afterFileId; su.lastUrl=t.afterUrl; su.lastInspectedAt=now;
      if(night){su.baseFileIdNight=t.afterFileId; su.baseUrlNight=t.afterUrl;} else {su.baseFileIdDay=t.afterFileId; su.baseUrlDay=t.afterUrl;} }
    if(result==="ป้ายทดแทน"&&ftn){ su.tenant=ftn; su.contract="ไม่มีสัญญา-ติดฟรี (ทดแทน)"; }
    b.update(db.doc("slots/"+s.id),su); Object.assign(s,su);
    if(thumb) b.set(db.doc("thumbs/"+s.id),{zoneId:s.zoneId,branch:s.branch,last:thumb,[night?"baseNight":"baseDay"]:thumb},{merge:true});
  }
  await b.commit(); delete S.tickets[t.id];
}

/* ================= นำเข้าโครงสร้าง RM / AM / สาขา (Super Admin) ================= */
async function importStructure(file,out){
  if(!file) return; out.innerHTML='<p class="muted">กำลังอ่านไฟล์…</p>';
  try{
    const wb=XLSX.read(await file.arrayBuffer());
    const ws=wb.Sheets["โครงสร้าง"]; if(!ws) throw new Error("ไม่พบชีต “โครงสร้าง” ใช้ไฟล์ Structure_RM_AM_Store.xlsx");
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:false}).slice(3);
    const str=v=>String(v==null?"":v).trim(), num=v=>{ const n=parseFloat(String(v).replace(/,/g,"")); return isFinite(n)?n:null; };
    const idOk=s=>/^[A-Za-z0-9_-]+$/.test(s), mailOk=s=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(s);
    const rms={}, zones={}, brs={}, users={}, rep=[];
    for(const r of rows){
      const [rmId,rmName,rmMail,zId,amName,amMail,code,name,fmt,lat,lng]=r.map(str);
      if(!code&&!zId&&!rmId) continue;
      if(!rmId||!zId||!code||!name){ rep.push(`ข้ามแถวสาขา ${code||"-"}: ข้อมูลไม่ครบ (ต้องมีรหัส RM, รหัสเขต, รหัสและชื่อสาขา)`); continue; }
      if(!idOk(rmId)||!idOk(zId)){ rep.push(`ข้ามสาขา ${code}: รหัส RM/เขต ใช้ได้เฉพาะ A–Z 0–9 - _`); continue; }
      if(zones[zId]&&zones[zId].rmId!==rmId){ rep.push(`ข้ามสาขา ${code}: เขต ${zId} อยู่ในหลาย RM ในไฟล์`); continue; }
      if(brs[code]){ rep.push(`ข้ามสาขา ${code}: รหัสซ้ำในไฟล์`); continue; }
      const ex=S.branches[code];
      if(ex&&ex.zoneId!==zId&&Object.values(S.slots).some(s=>s.branch===code)){ rep.push(`ไม่ย้ายสาขา ${code}: มีผังป้ายอยู่ในเขต ${ex.zoneId} แล้ว ให้ย้ายด้วยตนเอง`); continue; }
      rms[rmId]={name:rmName||(rms[rmId]||{}).name||rmId};
      zones[zId]={name:amName?`AM ${amName}`:zId, amName, rmId};
      brs[code]={zoneId:zId,name,format:fmt||"Lotus's",lat:num(lat),lng:num(lng)};
      if(amMail){ if(mailOk(amMail)) users[amMail.toLowerCase()]={role:"am",zoneId:zId,rmId:"",name:amName}; else rep.push(`Gmail AM ไม่ถูกต้อง: ${amMail}`); }
      if(rmMail){ if(mailOk(rmMail)) users[rmMail.toLowerCase()]={role:"rm",zoneId:"",rmId,name:rmName}; else rep.push(`Gmail RM ไม่ถูกต้อง: ${rmMail}`); }
    }
    const existing={}; (await db.collection("users").get()).forEach(d=>existing[d.id]=d.data());
    Object.keys(users).forEach(e=>{ if(existing[e]&&["super","viewer"].includes(existing[e].role)){ rep.push(`ไม่เปลี่ยนสิทธิ์ ${e}: เป็น ${ROLE_TH[existing[e].role]} อยู่แล้ว`); delete users[e]; } });
    const allZones=z=>Object.keys({...Object.fromEntries(Object.entries(S.zones).filter(([,v])=>v.rmId===z)),...Object.fromEntries(Object.entries(zones).filter(([,v])=>v.rmId===z))});
    const cnt=(o,base)=>{ const k=Object.keys(o); return `${k.length} (ใหม่ ${k.filter(x=>!base[x]).length})`; };
    out.innerHTML=`<div class="kpis" style="margin-top:10px"><div class="kpi"><span>RM</span><b>${cnt(rms,S.rms)}</b></div><div class="kpi"><span>เขต AM</span><b>${cnt(zones,S.zones)}</b></div>
      <div class="kpi"><span>สาขา</span><b>${cnt(brs,S.branches)}</b></div><div class="kpi"><span>บัญชีผู้ใช้</span><b>${cnt(users,existing)}</b></div></div>
      ${rep.length?`<details open><summary class="red">ต้องตรวจ ${rep.length} รายการ</summary><ul class="muted">${rep.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>`:""}
      <div class="row" style="justify-content:flex-end"><button class="pri" id="sxgo">ยืนยันนำเข้า</button></div>`;
    $("#sxgo",out).onclick=async e=>{
      busy(e.target,true,"กำลังนำเข้า…"); const now=FV.serverTimestamp(), ops=[];
      Object.entries(rms).forEach(([id,v])=>ops.push([db.doc("rms/"+id),{...v,updatedAt:now},"merge"]));
      Object.entries(zones).forEach(([id,v])=>ops.push([db.doc("zones/"+id),{...v,updatedAt:now},"merge"]));
      Object.entries(brs).forEach(([id,v])=>ops.push([db.doc("branches/"+id),{...v,updatedAt:now},"merge"]));
      Object.entries(users).forEach(([id,v])=>ops.push([db.doc("users/"+id),{name:v.name,role:v.role,zoneId:v.zoneId,rmId:v.rmId,
        branches:[],zones:v.role==="rm"?allZones(v.rmId):[],active:true,updatedBy:S.me.email,updatedAt:now},"merge"]));
      try{ await commitOps(ops); await loadAll(); await syncRMUsers(Object.keys(rms)); toast(`นำเข้าแล้ว ${Object.keys(brs).length} สาขา`,4000); render(); }
      catch(err){ busy(e.target,false); toast("นำเข้าไม่สำเร็จ: "+err.message,6000); }
    };
  }catch(err){ out.innerHTML=`<p class="red">${esc(err.message)}</p>`; }
}

function xDate(v){ if(!v) return ""; if(v instanceof Date) return new Date(v.getTime()-v.getTimezoneOffset()*60000).toISOString().slice(0,10); if(typeof v==="number"){ const d=new Date(Math.round((v-25569)*86400e3)); return d.toISOString().slice(0,10);} return String(v).slice(0,10); }
async function importExcel(file, zid, out){
  if(!file) return; out.innerHTML='<p class="muted">กำลังอ่านไฟล์…</p>';
  try{
    const wb=XLSX.read(await file.arrayBuffer(),{cellDates:true});
    const rows=n=>{ const ws=wb.Sheets[n]; if(!ws) throw new Error(`ไม่พบชีต “${n}” ใช้ไฟล์แม่แบบทะเบียนป้าย`); return XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:true}).slice(3); };
    const str=v=>String(v==null?"":v).trim();
    const typeCodeOf=v=>{ const n=parseInt(str(v),10); const t=TYPES.find(t=>t.n===n); return t?t.code:null; };
    const br=rows("สาขา").filter(r=>str(r[0])&&str(r[1]));
    const pts=rows("จุดป้าย").filter(r=>str(r[1])&&str(r[3])&&str(r[13])!=="แถวตัวอย่าง");
    const sls=rows("ช่องป้าย").filter(r=>str(r[1])&&str(r[4])&&str(r[21])!=="แถวตัวอย่าง");
    const report=[], ops=[], now=FV.serverTimestamp(); const okBranch=new Set();
    const zoneOfBranch=code=>S.branches[code]?S.branches[code].zoneId:null;
    for(const r of br){ const code=str(r[0]); const z=zoneOfBranch(code);
      if(z&&z!==zid){ report.push(`ข้ามสาขา ${code}: อยู่ในเขต ${z}`); continue; } okBranch.add(code);
      ops.push([db.doc("branches/"+code),{zoneId:zid,name:str(r[1]),format:str(r[2])||"Lotus's",updatedAt:now},"merge"]); }
    const pointIds=new Set(), ptInfo={};
    for(const r of pts){ const code=str(r[1]); if(!okBranch.has(code)&&zoneOfBranch(code)!==zid){ report.push(`ข้ามจุดของสาขา ${code}: ไม่ใช่สาขาในเขตนี้`); continue; }
      const tc=typeCodeOf(r[3]); if(!tc){ report.push(`ข้ามแถวจุด: ประเภทป้าย “${str(r[3])}” ไม่ถูกต้อง`); continue; }
      const sn=parseInt(r[4],10)||1, side=str(r[5])||"-", id=pointIdOf(code,tc,sn,side);
      pointIds.add(id); ptInfo[id]={branch:code,typeCode:tc};
      ops.push([db.doc("points/"+id),{branch:code,zoneId:zid,typeCode:tc,structNo:sn,side,sideName:str(r[6]),road:str(r[7]),direction:str(r[8]),lit:str(r[9])==="มีไฟ",
        slotCount:parseInt(r[10],10)||0,status:"approved",source:"import",createdBy:S.me.email,updatedAt:now},"merge"]); }
    const maxRC={}; let nSlot=0;
    for(const r of sls){ const pid=str(r[1]); const info=ptInfo[pid]||(S.points[pid]&&S.points[pid].zoneId===zid?S.points[pid]:null);
      if(!info){ report.push(`ข้ามช่อง ${pid}: ไม่พบรหัสจุดในไฟล์หรือในระบบ`); continue; }
      const no=parseInt(r[4],10); if(!no){ report.push(`ข้ามช่องของ ${pid}: ไม่มีลำดับช่อง`); continue; }
      const row=parseInt(r[5],10)||1, col=parseInt(r[6],10)||no; const id=slotIdOf(pid,no);
      maxRC[pid]={rows:Math.max(row,(maxRC[pid]||{}).rows||1),cols:Math.max(col,(maxRC[pid]||{}).cols||1)};
      const cond=COND.includes(str(r[19]))?str(r[19]):"ยังไม่ตรวจ", contract=CONTRACT.includes(str(r[12]))?str(r[12]):"ไม่ทราบสถานะ-รอตรวจสอบ";
      ops.push([db.doc("slots/"+id),{pointId:pid,branch:info.branch,zoneId:zid,typeCode:info.typeCode,no,row,col,w:Number(r[7])||null,h:Number(r[8])||null,lit:str(r[10])==="มีไฟ",
        tenant:str(r[11]),contract,unit:str(r[13]),rent:r[14]===""?null:Number(r[14]),start:xDate(r[15]),end:xDate(r[16]),install:xDate(r[17]),condition:cond,contentExpiry:xDate(r[20]),note:str(r[21]),source:"import",updatedAt:now},"merge"]);
      nSlot++; }
    Object.entries(maxRC).forEach(([pid,v])=>ops.push([db.doc("points/"+pid),v,"merge"]));
    out.innerHTML=`<p>พบ สาขา ${okBranch.size} · จุด ${pointIds.size} · ช่อง ${nSlot}</p>${report.length?`<details><summary>ข้าม ${report.length} รายการ</summary><ul class="muted">${report.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>`:""}
      <div class="row" style="justify-content:flex-end"><button class="pri" id="xgo" ${ops.length?"":"disabled"}>นำเข้า</button></div>`;
    $("#xgo",out).onclick=async e=>{ busy(e.target,true,"กำลังนำเข้า…"); try{ await commitOps(ops); await loadAll(); toast("นำเข้าเสร็จแล้ว"); render(); }catch(err){ busy(e.target,false); toast(err.message,6000);} };
  }catch(err){ out.innerHTML=`<p class="red">${esc(err.message)}</p>`; }
}

/* ================= เข้าสู่ระบบ ================= */
function viewLogin(msg){
  BOOTED=true; $("#hdr").hidden=true;
  const tiles=["ok","fill","ok","bad","empty","ok","ok","warn","ok"].map(c=>`<div class="tile c-${c}${c==="empty"?" empty":""}" style="min-width:46px;min-height:30px"></div>`).join("");
  $("#app").style.padding="0"; $("#app").style.maxWidth="none";
  $("#app").innerHTML=`<div class="login-wrap"><div class="login-top"><div class="pylon" aria-hidden="true"><div class="pgrid" style="grid-template-columns:repeat(3,46px)">${tiles}</div></div><div class="legs" style="width:120px" aria-hidden="true"><i></i><i></i></div>
    <h1>${esc(C.appName||"ตรวจป้าย")}</h1><p>ติดตามสภาพป้ายร้านค้า Pylon อาคาร และป้ายไฟ</p>
    <div class="brands"><span class="fmt fmt-lotus">Lotus's</span><span class="fmt fmt-makro">Makro</span><span class="fmt fmt-talad">Talad Super</span></div></div>
    <div class="login-card">${msg?`<div class="card" style="text-align:left">${msg}</div>`:""}<button class="sun" id="gl" style="width:100%;min-height:52px;font-size:17px">เข้าสู่ระบบด้วย Gmail</button>
    <p class="muted" style="text-align:center;margin:14px 0 0">ใช้ Gmail ที่ AM ของเขตเพิ่มสิทธิ์ไว้แล้ว · v${VERSION}</p></div></div>`;
  $("#gl").onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{ if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment") auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider()); else toast(e.message,5000); });
}
$("#logout").innerHTML=IC.out; $("#logout").onclick=()=>auth.signOut();
auth.onAuthStateChanged(async u=>{
  S.user=u; S.me=null;
  if(!u) return viewLogin();
  const email=u.email.toLowerCase();
  try{
    let d=await db.doc("users/"+email).get();
    if(!d.exists&&(C.superAdmins||[]).map(x=>x.toLowerCase()).includes(email)){ await db.doc("users/"+email).set({name:u.displayName||"",role:"super",zoneId:"",branches:[],active:true,createdAt:FV.serverTimestamp()}); d=await db.doc("users/"+email).get(); }
    if(!d.exists||!d.data().active) return viewLogin(`บัญชี <b>${esc(email)}</b> ยังไม่ได้รับสิทธิ์ใช้งาน ส่ง Gmail นี้ให้ AM ของเขตเพื่อเพิ่มสิทธิ์ <div style="margin-top:8px"><button onclick="auth.signOut()">ใช้ Gmail อื่น</button></div>`);
    S.me={email,...d.data()};
    if(!S.me.branches) S.me.branches=[];
    $("#hdr").hidden=false; $("#app").style.padding=""; $("#app").style.maxWidth=""; $("#appname").textContent=C.appName||"ตรวจป้าย";
    $("#who").textContent=`${S.me.name||email} · ${ROLE_TH[S.me.role]||""}${S.me.zoneId?" · "+S.me.zoneId:S.me.rmId?" · "+S.me.rmId:""}`;
    $("#app").innerHTML='<div class="empty-state">กำลังโหลดข้อมูล…</div>';
    await loadAll(); BOOTED=true;
    if((S.me.role==="branch"||S.me.role==="manager")&&S.me.branches.length===1&&!location.hash.replace(/^#\/?/,"")) return go("branch/"+S.me.branches[0]);
    render();
  }catch(e){ console.error(e); const m=String(e.message||e);
    const hint=/permission|insufficient/i.test(m)?"สิทธิ์ไม่ผ่าน: ตรวจว่า Gmail ใน firestore.rules และ config.js (superAdmins) ตรงกับ Gmail ที่ล็อกอิน และกด Publish Rules แล้ว"
      :/offline|unavailable|failed to get/i.test(m)?"เชื่อมต่อฐานข้อมูลไม่ได้: ตรวจว่าสร้าง Firestore Database แล้ว และชื่อฐานข้อมูลเป็น (default)":"";
    viewLogin(`โหลดข้อมูลไม่สำเร็จ: ${esc(m)}${hint?`<p><b>${hint}</b></p>`:""}<div style="margin-top:8px"><button onclick="auth.signOut()">ออกจากระบบ</button></div>`); }
});
</script>
