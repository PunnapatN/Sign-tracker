<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตรวจป้าย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Lotuss Smart HL";font-weight:300;font-display:swap;src:url(fonts/LotussSmartHL-Light.woff2) format("woff2"),url(fonts/LotussSmartHL-Light.ttf) format("truetype"),url(fonts/LotussSmartHL-Light.otf) format("opentype")}
@font-face{font-family:"Lotuss Smart HL";font-weight:400;font-display:swap;src:url(fonts/LotussSmartHL-Regular.woff2) format("woff2"),url(fonts/LotussSmartHL-Regular.ttf) format("truetype"),url(fonts/LotussSmartHL-Regular.otf) format("opentype")}
@font-face{font-family:"Lotuss Smart HL";font-weight:500;font-display:swap;src:url(fonts/LotussSmartHL-Medium.woff2) format("woff2"),url(fonts/LotussSmartHL-Medium.ttf) format("truetype"),url(fonts/LotussSmartHL-Medium.otf) format("opentype")}
@font-face{font-family:"Lotuss Smart HL";font-weight:700;font-display:swap;src:url(fonts/LotussSmartHL-Bold.woff2) format("woff2"),url(fonts/LotussSmartHL-Bold.ttf) format("truetype"),url(fonts/LotussSmartHL-Bold.otf) format("opentype")}
@font-face{font-family:"Lotuss Smart HL";font-weight:800;font-display:swap;src:url(fonts/LotussSmartHL-ExtraBold.woff2) format("woff2"),url(fonts/LotussSmartHL-ExtraBold.ttf) format("truetype"),url(fonts/LotussSmartHL-ExtraBold.otf) format("opentype")}
:root{
  /* ธีมแบรนด์ตามคู่มือ Corporate Brand Colors: Lotus's Green #00BCB4 (Pantone 3262 C), Lotus's Yellow #F9BE00 (Pantone 7408 C)
     --lotus-d / --lotus-dd เป็นเฉดเข้มของ Lotus's Green สำหรับพื้นหลังที่มีตัวอักษรสีขาว เพื่อให้อ่านง่าย */
  --sun:#F9BE00; --sun-d:#DDA800; --sun-l:#FEF3C7;
  --lotus:#00BCB4; --lotus-d:#007A74; --lotus-dd:#004F4B; --lotus-l:#E0F7F6;
  --makro:#D7262E; --makro-d:#A81920; --makro-l:#FDE8E9;
  --ink:#152320; --ink2:#4A5E5A; --muted:#7D8F8B; --paper:#F4F7F6; --card:#fff; --line:#DCE5E3;
  --pylon:#1C2725;
  --ok:#0E6B3A; --ok-bg:#D9F2E3; --warn:#8A3F00; --warn-bg:#FFE3C7; --bad:#B0161E; --bad-bg:#FCDDDE;
  --fill:#1D4EA8; --fill-bg:#DCE7FF; --none:#5D6B68; --none-bg:#E5EBE9;
  --r:14px; --font:"Lotuss Smart HL","IBM Plex Sans Thai",Tahoma,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:9px 16px;min-height:44px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:6px}
button:hover{border-color:#b9c9c6}
button.pri{background:var(--lotus-d);border-color:var(--lotus-d);color:#fff}
button.pri:hover{background:var(--lotus-dd);border-color:var(--lotus-dd)}
button.sun{background:var(--sun);border-color:var(--sun);color:var(--lotus-dd);font-weight:700}
button.sun:hover{background:var(--sun-d);border-color:var(--sun-d)}
button.dan{color:var(--makro);border-color:#f2b8bb}
button:disabled{opacity:.45;cursor:default}
button svg{width:18px;height:18px;flex:none}
:focus-visible{outline:3px solid var(--lotus);outline-offset:2px}
input,select,textarea{border:1.5px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff;width:100%;min-height:44px}
input:focus,select:focus{border-color:var(--lotus);outline:none;box-shadow:0 0 0 3px var(--sun-l)}
label{display:block;font-size:14px;color:var(--ink2);margin:12px 0 4px;font-weight:500}
a{color:var(--lotus-d);font-weight:500}
/* แถบบน */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--lotus-dd);color:#fff;border-bottom:4px solid var(--sun)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--lotus-dd);z-index:30}
.hbar{display:flex;align-items:center;gap:12px;padding:10px 16px;max-width:1120px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand b{font-weight:800;font-size:20px;letter-spacing:.2px;white-space:nowrap}
.mark{width:24px;height:24px;flex:none;background:var(--lotus);border-radius:50% 50% 0 50%;transform:rotate(45deg);display:flex;align-items:center;justify-content:center}
.mark::after{content:"";width:9px;height:9px;border-radius:50%;background:var(--sun)}
.mark i{display:none}
.mark i{height:7px;border-radius:1px;background:var(--lotus)}.mark i:nth-child(2){background:#fff}.mark i:nth-child(3){background:var(--sun)}
.who{font-size:13px;opacity:.85;text-align:right;line-height:1.25;max-width:45vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{background:transparent;border:1.5px solid rgba(255,255,255,.3);color:#fff;min-height:38px;padding:6px 10px}
.iconbtn:hover{border-color:#fff}
/* เมนู: บนจอใหญ่เป็นแถบ บนมือถือเป็นแถบล่าง */
nav{display:flex;gap:4px;max-width:1120px;margin:0 auto;padding:0 12px 10px}
nav a{display:flex;align-items:center;gap:6px;color:#bfe3df;text-decoration:none;padding:7px 14px;border-radius:999px;font-weight:500;position:relative}
nav a svg{width:22px;height:22px}
nav a.on{background:var(--sun);color:var(--lotus-dd);font-weight:700}
nav .n{background:var(--sun);color:var(--lotus-dd);border-radius:999px;padding:0 6px;font-size:12px;font-weight:700;min-width:20px;text-align:center;line-height:18px}
@media(max-width:720px){
  nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around;max-width:none}
  nav a{flex-direction:column;gap:2px;font-size:12px;color:var(--ink2);padding:6px 4px;border-radius:12px;flex:1;max-width:100px}
  nav a.on{background:var(--sun-l);color:var(--lotus-dd);font-weight:700}
  nav a.on::before{content:"";position:absolute;top:-7px;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--sun)}
  nav a .n{background:var(--sun)}
  nav.many a{font-size:11px;padding:6px 2px}nav.many a svg{width:20px;height:20px}
  nav .n{position:absolute;top:2px;right:calc(50% - 22px)}
  main{padding-bottom:96px!important}
  .who{display:none}
}
main{max-width:1120px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:26px;font-weight:800;margin:4px 0 14px;line-height:1.2}
h2{font-size:19px;font-weight:700;margin:26px 0 10px}
.crumb{font-size:14px;display:inline-flex;align-items:center;gap:4px;margin-bottom:4px;text-decoration:none}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.muted{color:var(--muted);font-size:14px}
.red{color:var(--bad);font-weight:700}
.num{text-align:right;font-variant-numeric:tabular-nums}
/* ภาพรวม: แถบสุขภาพป้าย */
.hero{background:var(--lotus-dd);color:#fff;border-radius:18px;padding:18px 18px 16px;margin-bottom:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-34px;bottom:-60px;width:150px;height:150px;border-radius:50% 50% 0 50%;transform:rotate(45deg);background:var(--lotus);opacity:.35}
.hero>*{position:relative;z-index:1}
.hero .t{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.hero .t b{font-size:15px;font-weight:500;opacity:.85}
.hero .t span{font-size:14px;opacity:.75}
.hero .big{font-size:40px;font-weight:800;line-height:1.1;margin:6px 0 12px;color:var(--sun)}
.hero .big small{font-size:16px;font-weight:400;color:#fff;opacity:.85;margin-left:6px}
.health{display:flex;height:14px;border-radius:999px;overflow:hidden;background:#2a3b38;gap:2px}
.health i{display:block;height:100%;min-width:3px}
.hero .health{height:20px;background:rgba(255,255,255,.12)}
.bcard .health,.card .health{background:var(--line)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.h-ok{background:#2BB673}.h-warn{background:#F08A24}.h-bad{background:var(--makro)}.h-empty{background:#fff;box-shadow:inset 0 0 0 1px #9aa}.h-fill{background:#5B8DEF}.h-none{background:#8C9A97}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;border-left:5px solid var(--line)}
.kpi span{display:block;font-size:13px;color:var(--ink2)}
.kpi b{font-size:28px;font-weight:800;line-height:1.2}
.kpi.alert{border-left-color:var(--makro)}.kpi.alert b{color:var(--makro)}
.kpi.good{border-left-color:var(--lotus)}
.kpi.info{border-left-color:var(--sun)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input[type=search]{max-width:260px}
.toolbar select{max-width:240px}
/* การ์ดสาขา */
.blist{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.bcard{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;cursor:pointer;text-align:left;width:100%;display:block;min-height:0;font-weight:400}
.bcard:hover{border-color:var(--sun);box-shadow:0 0 0 3px var(--sun-l)}
.bcard .top{display:flex;align-items:flex-start;gap:8px;margin-bottom:10px}
.bcard .code{font-size:13px;color:var(--muted)}
.bcard .name{font-size:18px;font-weight:700;line-height:1.25}
.bcard .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:10px;text-align:center}
.bcard .stats div{background:var(--paper);border-radius:10px;padding:6px 2px}
.bcard .stats b{display:block;font-size:18px;font-weight:800}
.bcard .stats span{font-size:12px;color:var(--ink2)}
.bcard .stats .hot b{color:var(--makro)}
.prog{height:6px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:10px}.prog i{display:block;height:100%;background:var(--sun)}
.fmt{font-size:12px;font-weight:700;border-radius:6px;padding:2px 8px;white-space:nowrap}
.fmt-lotus{background:var(--lotus-l);color:var(--lotus-d)}.fmt-makro{background:var(--makro-l);color:var(--makro-d)}.fmt-talad{background:#FFF3D6;color:#7A4D00}
.tbl{width:100%;border-collapse:collapse;font-size:15px}
.tbl th{text-align:left;font-weight:500;color:var(--ink2);font-size:13px;border-bottom:1px solid var(--line);padding:8px 6px}
.tbl td{border-bottom:1px solid #EDF2F1;padding:10px 6px;vertical-align:top}
.scroll{overflow-x:auto}
.chip{display:inline-block;border-radius:8px;padding:2px 9px;font-size:13px;font-weight:500;white-space:nowrap}
.c-ok{background:var(--ok-bg);color:var(--ok)}.c-warn{background:var(--warn-bg);color:var(--warn)}
.c-bad{background:var(--bad-bg);color:var(--bad)}.c-fill{background:var(--fill-bg);color:var(--fill)}
.c-none{background:var(--none-bg);color:var(--none)}.c-empty{background:#fff;color:var(--ink);border:1.5px dashed var(--ink2)}
/* ผังป้าย */
.pylon{display:inline-block;background:var(--pylon);border-radius:10px 10px 3px 3px;padding:10px;max-width:100%;border-top:6px solid var(--sun)}
.pylon .head{color:#A7DCD6;font-size:13px;padding:0 2px 8px;display:flex;justify-content:space-between;gap:10px;font-weight:500}
.pgrid{display:grid;gap:5px}
.tile{min-width:78px;min-height:52px;border-radius:5px;padding:5px 7px;font-size:12px;line-height:1.3;border:0;text-align:left;display:flex;flex-direction:column;justify-content:space-between;align-items:stretch;overflow:hidden;font-weight:500}
.tile b{font-weight:800;font-size:11px;opacity:.7}
.tile.empty{background:#fff;color:#556;box-shadow:0 0 0 1px #fff,0 0 14px 3px rgba(255,255,255,.5)}
.tile.cur{outline:3px solid #FFD54A;outline-offset:2px}
.tile.retake{outline:3px dashed #FF5A4E;outline-offset:-3px}
.tile.retake b::after{content:" ⟳ ถ่ายใหม่";color:var(--bad)}
.tile.skip{background:transparent;border:1px dashed #45524F}
.legs{display:flex;justify-content:space-around;height:18px}.legs i{width:14px;background:var(--pylon)}
.sign{display:inline-block;max-width:100%;vertical-align:top}
.sg-head{background:var(--lotus);border-radius:10px 10px 0 0;padding:10px 16px 8px;text-align:center;line-height:1}
.sg-logo{font-weight:800;color:#fff;font-size:30px;letter-spacing:-.5px;white-space:nowrap}.sg-logo em{font-style:normal;color:var(--sun)}
.sg-name{background:#232323;color:#fff;font-weight:800;text-align:center;letter-spacing:3px;padding:5px 8px;font-size:15px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sg-body{background:var(--lotus);padding:8px;border-radius:0 0 4px 4px}
.sign.plain .sg-body{border-radius:8px;border-top:5px solid var(--sun)}
.sign.tt .sg-logo{font-size:22px}.sign.tt .sg-name{font-size:12px;letter-spacing:2px}
.sg-body .tile.skip{border:1px dashed rgba(255,255,255,.55);background:rgba(255,255,255,.08)}
.sg-legs{display:flex;justify-content:space-around;height:18px}.sg-legs i{width:14px;background:#2d2d2d}
.sg-base{height:12px;background:#2d2d2d;margin:0 -8px;border-radius:2px}
.sg-cap{font-size:13px;color:var(--ink2);margin-top:6px;font-weight:500}
.pt{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:start}
@media(max-width:640px){.pt{grid-template-columns:1fr}}
.pinfo b{font-size:18px;font-weight:700}
.status-line{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.step{font-size:14px;color:var(--lotus-d);font-weight:700}
.stepbar{display:flex;gap:4px;margin:6px 0 12px}.stepbar i{flex:1;height:5px;border-radius:999px;background:var(--line)}.stepbar i.on{background:var(--sun)}
/* ส่วนประกอบอื่น */
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:60;max-width:90vw;font-weight:500}
.modal{position:fixed;inset:0;background:rgba(8,26,23,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0}
.modal .box{background:#fff;border-radius:20px 20px 0 0;max-width:640px;width:100%;max-height:92vh;overflow:auto;padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:721px){.modal{align-items:center;padding:16px}.modal .box{border-radius:20px}}
.modal.full{padding:0;background:#000;align-items:stretch}
.cam{position:relative;width:100vw;height:100vh;height:100dvh;display:flex;flex-direction:column;touch-action:none;-webkit-user-select:none;user-select:none}
.cam-view{position:relative;flex:1;min-height:0;overflow:hidden;background:#000}
.cam-view video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:center center}
.cam-zoom{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;background:rgba(0,0,0,.45);padding:4px;border-radius:999px;z-index:2}
.cam-zoom button{min-height:36px;min-width:44px;padding:0 10px;border-radius:999px;border:0;background:transparent;color:#fff;font-size:14px;font-weight:700}
.cam-zoom button.on{background:var(--sun);color:var(--lotus-dd)}
.cam-hint{position:absolute;left:12px;right:12px;bottom:64px;text-align:center;color:#fff;font-size:13px;text-shadow:0 1px 2px #000;z-index:2}
.cam-label{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:12px;right:12px;color:#fff;background:rgba(0,70,63,.8);padding:8px 12px;border-radius:12px;font-size:15px;font-weight:500;border-left:4px solid var(--sun)}
.crop-wrap{position:relative;flex:1;min-height:0;overflow:hidden;background:#000;touch-action:none}
.crop-wrap img{position:absolute;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none}
.crop-box{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);touch-action:none;cursor:move}
.crop-box i{position:absolute;width:30px;height:30px;border:4px solid var(--sun);touch-action:none}
.crop-box i[data-h=tl]{left:-5px;top:-5px;border-right:0;border-bottom:0}.crop-box i[data-h=tr]{right:-5px;top:-5px;border-left:0;border-bottom:0}
.crop-box i[data-h=bl]{left:-5px;bottom:-5px;border-right:0;border-top:0}.crop-box i[data-h=br]{right:-5px;bottom:-5px;border-left:0;border-top:0}
.cam-mode{display:flex;gap:6px;justify-content:center;padding:8px;background:#000}
.cam-mode button{min-height:36px;border-radius:999px;background:transparent;color:#fff;border:1px solid #555;font-size:14px;padding:0 14px}
.cam-mode button.on{background:var(--sun);color:var(--lotus-dd);border-color:var(--sun);font-weight:700}
.lay{display:grid;gap:4px;margin:8px 0;max-width:420px}
.lay button{min-height:40px;padding:2px;border-radius:6px;font-size:12px;background:#E5EBE9;border:2px solid transparent;color:var(--ink)}
.lay button.sel{border-color:var(--sun);background:var(--sun-l)}
.lay button.none{background:transparent;border:1px dashed #9aa;color:#9aa}
.lay button.merged{background:var(--lotus-l);color:var(--lotus-dd);font-weight:700}
.cam-frame{position:absolute;border:2px dashed #fff;border-radius:6px;pointer-events:none;box-shadow:0 0 0 9999px rgba(0,0,0,.45);z-index:1}
.cam-frame::before,.cam-frame::after{content:"";position:absolute;width:18px;height:18px;border:3px solid var(--sun)}
.cam-frame::before{left:-3px;top:-3px;border-right:0;border-bottom:0}.cam-frame::after{right:-3px;bottom:-3px;border-left:0;border-top:0}
.cam-bar{display:flex;align-items:center;justify-content:space-between;padding:16px 22px calc(16px + env(safe-area-inset-bottom,0px));background:#000}
.cam-bar button{background:transparent;color:#fff;border-color:#555}
.cam-bar button.sun{background:var(--sun);border-color:var(--sun);color:var(--lotus-dd)}
.cam-label{z-index:3}
.shutter{width:74px;height:74px;border-radius:50%!important;background:#fff!important;border:6px solid var(--sun)!important;padding:0}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumbs figure{margin:0;font-size:13px;color:var(--ink2)}
.thumbs img{width:156px;height:116px;object-fit:cover;border-radius:10px;background:#eee;display:block;margin-bottom:4px}
.empty-state{text-align:center;padding:34px 12px;color:var(--ink2)}
.check{display:flex;gap:8px;align-items:center;font-size:15px;margin:6px 14px 6px 0;font-weight:400;color:var(--ink)}
.check input{width:20px;height:20px;min-height:0;accent-color:var(--lotus)}
.check{flex-wrap:wrap}.check>.red{flex-basis:100%;padding-left:28px;margin-top:-4px}
details summary{cursor:pointer}
/* ตัวกรอง + ผู้ใช้ */
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters select{flex:1;min-width:150px;max-width:280px}
button.ghost{border-color:transparent;background:transparent;color:var(--lotus-d)}
.rolebar{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.rolepill{border-radius:999px;min-height:38px;padding:6px 14px;white-space:nowrap;font-weight:500}
.rolepill b{font-weight:800;margin-left:2px}
.rolepill.on{background:var(--sun);border-color:var(--sun);color:var(--lotus-dd)}
.rdot{width:10px;height:10px;border-radius:50%;display:inline-block}
.ulist{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px;margin-bottom:8px}
@media(max-width:420px){.ulist{grid-template-columns:1fr}}

function healthBar(slots){ const c=healthCounts(slots), n=slots.length||1; if(!slots.length) return '<div class="health" aria-label="ยังไม่มีช่องป้าย"></div>';

const $ = (s,el=document) => el.querySelector(s);

async function commitOps(ops){ for(let i=0;i<ops.length;i+=400){ const b=db.batch(); ops.slice(i,i+400).forEach(([ref,data,mode])=>{ if(mode==="update") b.update(ref,data); else b.set(ref,data,{merge:mode==="merge"}); }); await b.commit(); } }

function haversine(a,b,c,d){ const R=6371000, r=x=>x*Math.PI/180; const x=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2; return 2*R*Math.asin(Math.sqrt(x)); }

const CROP_MODES=[["wide","แนวนอน"],["square","ด้าน×ด้าน"],["free","อิสระ"]];

function finishPhoto(canvas, rect, stamp){
  const r=rect||{x:0,y:0,w:canvas.width,h:canvas.height};
  const out=(maxSide,q,withStamp)=>{ const k=Math.min(1,maxSide/Math.max(r.w,r.h)); const c=document.createElement("canvas"); c.width=Math.max(1,Math.round(r.w*k)); c.height=Math.max(1,Math.round(r.h*k));
    const x=c.getContext("2d"); x.drawImage(canvas,r.x,r.y,r.w,r.h,0,0,c.width,c.height);
    if(withStamp){ const fs=Math.max(12,Math.round(c.width/48)); x.fillStyle="rgba(0,0,0,.6)"; x.fillRect(0,c.height-fs*2.2,c.width,fs*2.2); x.fillStyle="#fff"; x.font=`${fs}px Tahoma,sans-serif`; x.fillText(stamp,fs*.6,c.height-fs*.75); }
    return c.toDataURL("image/jpeg",q); };
  return {full:out(1600,.82,true), thumb:out(320,.55,false)};
}

/* หน้าตัดภาพ: ลากกรอบเพื่อย้าย ลากมุมเหลืองเพื่อปรับขนาด เลือกสัดส่วน แนวนอน / ด้าน×ด้าน / อิสระ */
function cropEditor(canvas, label, signAspect){
  return new Promise((resolve,reject)=>{
    let mode=defaultCropMode(signAspect);
    const m=modal(`<div class="cam"><div class="cam-label">ตัดภาพเฉพาะป้าย · ${esc(label)}</div><div class="crop-wrap"><img alt="ภาพที่ถ่าย"><div class="crop-box"><i data-h="tl"></i><i data-h="tr"></i><i data-h="bl"></i><i data-h="br"></i></div></div>
      <div class="cam-mode">${CROP_MODES.map(([k,t])=>`<button data-m="${k}">${t}</button>`).join("")}</div>
      <div class="cam-bar"><button data-re>ถ่ายใหม่</button><button class="sun" data-ok style="min-width:130px">ใช้ภาพนี้</button></div></div>`,{full:true});
    const wrap=$(".crop-wrap",m.el), img=$("img",m.el), box=$(".crop-box",m.el), W=canvas.width, H=canvas.height;
    img.src=canvas.toDataURL("image/jpeg",.9);
    let D={s:1,ox:0,oy:0}, R={x:0,y:0,w:W,h:H};
    const fit=()=>{ const cw=wrap.clientWidth, ch=wrap.clientHeight, s=Math.min(cw/W,ch/H); D={s,ox:(cw-W*s)/2,oy:(ch-H*s)/2};
      Object.assign(img.style,{width:W*s+"px",height:H*s+"px",left:D.ox+"px",top:D.oy+"px"}); draw(); };
    const draw=()=>Object.assign(box.style,{left:D.ox+R.x*D.s+"px",top:D.oy+R.y*D.s+"px",width:R.w*D.s+"px",height:R.h*D.s+"px"});
    const clamp=()=>{ R.w=Math.min(R.w,W); R.h=Math.min(R.h,H); R.x=Math.max(0,Math.min(W-R.w,R.x)); R.y=Math.max(0,Math.min(H-R.h,R.y)); };
    const init=()=>{ const a=cropAspect(mode,signAspect); let w=W*.62, hh=a?w/a:H*.45; if(hh>H*.6){ hh=H*.6; if(a) w=hh*a; } R={x:(W-w)/2,y:(H-hh)/2,w,h:hh}; clamp(); draw();
      $$("[data-m]",m.el).forEach(b=>b.classList.toggle("on",b.dataset.m===mode)); };
    $$("[data-m]",m.el).forEach(b=>b.onclick=()=>{ mode=b.dataset.m; S.cropMode=mode; init(); });
    let drag=null; const MIN=60;
    const down=e=>{ e.preventDefault(); const h=e.target.dataset.h||"move"; drag={h,px:e.clientX,py:e.clientY,r:{...R}}; box.setPointerCapture&&box.setPointerCapture(e.pointerId); };
    const move=e=>{ if(!drag) return; e.preventDefault(); const dx=(e.clientX-drag.px)/D.s, dy=(e.clientY-drag.py)/D.s, o=drag.r, a=cropAspect(mode,signAspect);
      if(drag.h==="move"){ R.x=o.x+dx; R.y=o.y+dy; clamp(); return draw(); }
      let x1=o.x, y1=o.y, x2=o.x+o.w, y2=o.y+o.h;
      if(drag.h.includes("l")) x1=Math.min(x2-MIN,Math.max(0,o.x+dx)); if(drag.h.includes("r")) x2=Math.max(x1+MIN,Math.min(W,x2+dx));
      if(drag.h.includes("t")) y1=Math.min(y2-MIN,Math.max(0,o.y+dy)); if(drag.h.includes("b")) y2=Math.max(y1+MIN,Math.min(H,y2+dy));
      let w=x2-x1, hh=y2-y1;
      if(a){ hh=w/a; if(drag.h.includes("t")) y1=y2-hh; else y2=y1+hh; if(y1<0||y2>H){ hh=Math.min(hh,drag.h.includes("t")?y2:H-y1); w=hh*a; if(drag.h.includes("l")) x1=x2-w; else x2=x1+w; if(drag.h.includes("t")) y1=y2-hh; else y2=y1+hh; } }
      R={x:x1,y:y1,w:x2-x1,h:y2-y1}; clamp(); draw(); };
    const up=()=>{ drag=null; };
    box.addEventListener("pointerdown",down); window.addEventListener("pointermove",move,{passive:false}); window.addEventListener("pointerup",up);
    const stopG=e=>e.preventDefault(); ["gesturestart","gesturechange"].forEach(ev=>document.addEventListener(ev,stopG,{passive:false}));
    const done=()=>{ window.removeEventListener("pointermove",move); window.removeEventListener("pointerup",up); window.removeEventListener("resize",fit); ["gesturestart","gesturechange"].forEach(ev=>document.removeEventListener(ev,stopG)); m.close(); };
    img.onload=()=>{ fit(); init(); }; window.addEventListener("resize",fit);
    $("[data-re]",m.el).onclick=()=>{ done(); reject(new Error("retake")); };
    $("[data-ok]",m.el).onclick=()=>{ const r={x:Math.round(R.x),y:Math.round(R.y),w:Math.round(R.w),h:Math.round(R.h)}; done(); resolve(r); };
  });
}

function pylonHTML(p, slots, curKey){
  const t=typeOf(p), rs=s=>s.rowSpan||1, cs=s=>s.colSpan||1, br=S.branches[p.branch]||{};
  const rows=Math.max(p.rows||1,...slots.map(s=>(s.row||1)+rs(s)-1)), cols=Math.max(p.cols||1,...slots.map(s=>(s.col||1)+cs(s)-1));
  const cover={}; slots.forEach(s=>{ for(let r=s.row;r<s.row+rs(s);r++) for(let c=s.col;c<s.col+cs(s);c++) cover[`${r}-${c}`]=1; });
  let cells="";
  for(let r=1;r<=rows;r++) for(let c=1;c<=cols;c++) if(!cover[`${r}-${c}`]) cells+=`<div class="tile skip" style="grid-row:${r};grid-column:${c}"></div>`;
  slots.forEach(s=>{ const key=`${s.row}-${s.col}`, cur=curKey===key?" cur":"", cls=COND_CLS[s.condition||"ยังไม่ตรวจ"]||"none", pos=`grid-row:${s.row} / span ${rs(s)};grid-column:${s.col} / span ${cs(s)}`;
    cells+=s.pending?`<div class="tile c-none${cur}" style="${pos};opacity:.6"><b>…</b><span>${esc(s.view||"รอถ่าย")}</span></div>`
      :`<button class="tile c-${cls}${cls==="empty"?" empty":""}${s.retake?" retake":""}${cur}" data-slot="${esc(s.id||"")}" style="${pos}" title="${esc(s.id||"")}"><b>${String(s.no).padStart(2,"0")}</b><span>${esc(s.view||s.tenant|| (cls==="empty"?"ว่าง":"—"))}</span></button>`; });
  const head=(t.code==="PY"||t.code==="TT")?`<div class="sg-head"><span class="sg-logo">Lotus<em>'s</em></span></div><div class="sg-name">${esc(br.name||p.branch||"")}</div>`:"";
  const foot=t.code==="PY"?'<div class="sg-legs"><i></i><i></i></div>':t.code==="TT"?'<div class="sg-base"></div>':"";
  return `<div class="sign ${head?"":"plain"} ${t.code==="TT"?"tt":""}">${head}<div class="sg-body"><div class="pgrid" style="grid-template-columns:repeat(${cols},minmax(${t.code==="TT"?58:74}px,1fr))">${cells}</div></div>${foot}
    <div class="sg-cap">${esc(t.name)} ${esc(p.structNo)}${p.side&&p.side!=="-"?" · ฝั่ง "+esc(p.side):""}${p.lit?" · มีไฟ":""}</div></div>`;
}

/* ================= ตัวแก้ผังช่องป้าย (ลงทะเบียน / แก้ร่าง / แก้ไขจุด) ================= */
function layoutEditor(host, init){
  const L={rows:Math.max(1,init.rows||1), cols:Math.max(1,init.cols||1), regions:(init.regions||[]).map(g=>({row:g.row,col:g.col,rowSpan:g.rowSpan||1,colSpan:g.colSpan||1})), sel:new Set()};
  const fill=()=>{ L.regions=[]; for(let r=1;r<=L.rows;r++) for(let c=1;c<=L.cols;c++) L.regions.push({row:r,col:c,rowSpan:1,colSpan:1}); };
  if(!L.regions.length) fill();
  host.innerHTML=`<div class="row"><div class="grow"><label>จำนวนแถว (บน→ล่าง)</label><input data-l="rows" type="number" min="1" max="20" value="${L.rows}"></div>
    <div class="grow"><label>จำนวนคอลัมน์ (ซ้าย→ขวา)</label><input data-l="cols" type="number" min="1" max="12" value="${L.cols}"></div></div>
    <label>ผังช่องป้าย (แตะเลือกช่อง แล้วกดปุ่มด้านล่าง)</label><div class="lay" data-l="grid"></div>
    <div class="row"><button data-l="merge">รวมป้าย</button><button data-l="split">แยกป้าย</button><button data-l="none">ไม่มีป้ายตรงนี้</button><button data-l="add">เพิ่มป้ายตรงนี้</button><button data-l="reset" class="ghost">เริ่มผังใหม่</button></div>
    <p class="muted" data-l="msg"></p>`;
  const q=k=>host.querySelector(`[data-l="${k}"]`);
  const regAt=(r,c)=>L.regions.find(g=>r>=g.row&&r<g.row+g.rowSpan&&c>=g.col&&c<g.col+g.colSpan);
  const cellsOf=g=>{ const a=[]; for(let i=0;i<g.rowSpan;i++) for(let j=0;j<g.colSpan;j++) a.push(`${g.row+i}-${g.col+j}`); return a; };
  const draw=()=>{ const el=q("grid"); el.style.gridTemplateColumns=`repeat(${L.cols},1fr)`; let html="";
    for(let r=1;r<=L.rows;r++) for(let c=1;c<=L.cols;c++){ const k=`${r}-${c}`, g=regAt(r,c);
      if(!g){ html+=`<button data-k="${k}" class="none ${L.sel.has(k)?"sel":""}" style="grid-row:${r};grid-column:${c}">ไม่มี</button>`; continue; }
      if(g.row!==r||g.col!==c) continue;
      const big=g.rowSpan*g.colSpan>1, sel=cellsOf(g).some(x=>L.sel.has(x));
      html+=`<button data-k="${k}" class="${big?"merged":""} ${sel?"sel":""}" style="grid-row:${r} / span ${g.rowSpan};grid-column:${c} / span ${g.colSpan}">${big?"รวม "+g.rowSpan+"×"+g.colSpan:r+"-"+c}</button>`; }
    el.innerHTML=html;
    el.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{ const [r,c]=b.dataset.k.split("-").map(Number), g=regAt(r,c), ks=g?cellsOf(g):[b.dataset.k];
      const on=ks.some(k=>L.sel.has(k)); ks.forEach(k=>on?L.sel.delete(k):L.sel.add(k)); draw(); });
    q("msg").textContent=`ผังนี้มี ${L.regions.length} ป้าย`+(L.sel.size?` · เลือกอยู่ ${L.sel.size} ช่อง`:""); };
  const resize=()=>{ const R=Math.max(1,Math.min(20,+q("rows").value||1)), C=Math.max(1,Math.min(12,+q("cols").value||1)), oR=L.rows, oC=L.cols;
    L.regions=L.regions.filter(g=>g.row+g.rowSpan-1<=R&&g.col+g.colSpan-1<=C);
    for(let r=1;r<=R;r++) for(let c=1;c<=C;c++) if((r>oR||c>oC)&&!regAt(r,c)) L.regions.push({row:r,col:c,rowSpan:1,colSpan:1});
    L.rows=R; L.cols=C; L.sel.clear(); draw(); };
  q("rows").oninput=resize; q("cols").oninput=resize;
  const selCells=()=>[...L.sel].map(k=>k.split("-").map(Number));
  q("merge").onclick=()=>{ const ks=selCells(); if(ks.length<2) return toast("แตะเลือกอย่างน้อย 2 ช่องที่อยู่ติดกัน");
    const r1=Math.min(...ks.map(k=>k[0])), r2=Math.max(...ks.map(k=>k[0])), c1=Math.min(...ks.map(k=>k[1])), c2=Math.max(...ks.map(k=>k[1]));
    if(ks.length!==(r2-r1+1)*(c2-c1+1)) return toast("ช่องที่เลือกต้องเป็นรูปสี่เหลี่ยมเต็ม ไม่เว้นช่อง");
    const hit=L.regions.filter(g=>!(g.row>r2||g.row+g.rowSpan-1<r1||g.col>c2||g.col+g.colSpan-1<c1));
    if(hit.some(g=>g.row<r1||g.row+g.rowSpan-1>r2||g.col<c1||g.col+g.colSpan-1>c2)) return toast("มีป้ายรวมที่ล้นออกนอกส่วนที่เลือก ให้เลือกให้ครอบคลุม");
    L.regions=L.regions.filter(g=>!hit.includes(g)); L.regions.push({row:r1,col:c1,rowSpan:r2-r1+1,colSpan:c2-c1+1}); L.sel.clear(); draw(); };
  q("split").onclick=()=>{ const gs=[...new Set(selCells().map(([r,c])=>regAt(r,c)).filter(g=>g&&g.rowSpan*g.colSpan>1))]; if(!gs.length) return toast("แตะเลือกป้ายรวมที่ต้องการแยก");
    gs.forEach(g=>{ L.regions=L.regions.filter(x=>x!==g); cellsOf(g).forEach(k=>{ const [r,c]=k.split("-").map(Number); L.regions.push({row:r,col:c,rowSpan:1,colSpan:1}); }); }); L.sel.clear(); draw(); };
  q("none").onclick=()=>{ const gs=[...new Set(selCells().map(([r,c])=>regAt(r,c)).filter(Boolean))]; if(!gs.length) return toast("แตะเลือกป้ายที่ไม่มีจริงก่อน");
    L.regions=L.regions.filter(g=>!gs.includes(g)); L.sel.clear(); draw(); };
  q("add").onclick=()=>{ const ks=selCells().filter(([r,c])=>!regAt(r,c)); if(!ks.length) return toast("แตะเลือกช่อง “ไม่มี” ที่ต้องการเพิ่มป้าย");
    ks.forEach(([r,c])=>L.regions.push({row:r,col:c,rowSpan:1,colSpan:1})); L.sel.clear(); draw(); };
  q("reset").onclick=()=>{ fill(); L.sel.clear(); draw(); };
  draw();
  return {get:()=>({rows:L.rows,cols:L.cols,regions:L.regions.slice().sort((a,b)=>a.row-b.row||a.col-b.col)})};
}
/* เทียบผังใหม่กับป้ายที่มีอยู่: ป้ายที่ตำแหน่งเริ่มต้นเดิมยังอยู่ = เก็บไว้ (ประวัติภาพไม่หาย) */
function layoutPlan(pid, lay){
  const ss=Object.values(S.slots).filter(s=>s.pointId===pid), key=g=>`${g.row}-${g.col}`, starts=new Set(lay.regions.map(key));
  const keep=[], create=[]; lay.regions.forEach(g=>{ const s=ss.find(x=>key(x)===key(g)); s?keep.push([s,g]):create.push(g); });
  return {keep, create, del:ss.filter(s=>!starts.has(key(s)))};
}
async function commitLayout(p, lay, plan, extra={}, createSlots=true){
  const now=FV.serverTimestamp(), ops=[]; let maxNo=Math.max(0,...Object.values(S.slots).filter(s=>s.pointId===p.id).map(s=>s.no||0));
  ops.push([db.doc("points/"+p.id),{rows:lay.rows,cols:lay.cols,regions:lay.regions,...(createSlots?{slotCount:plan.keep.length+plan.create.length}:{}),...extra,updatedAt:now},"update"]);
  plan.keep.forEach(([s,g])=>{ if((s.rowSpan||1)!==g.rowSpan||(s.colSpan||1)!==g.colSpan) ops.push([db.doc("slots/"+s.id),{rowSpan:g.rowSpan,colSpan:g.colSpan,updatedAt:now},"update"]); });
  plan.del.forEach(s=>ops.push([db.doc("slots/"+s.id),null,"delete"]));
  const created=[];
  if(createSlots) plan.create.forEach(g=>{ const no=++maxNo, id=slotIdOf(p.id,no);
    const d={pointId:p.id,branch:p.branch,zoneId:p.zoneId,typeCode:p.typeCode,no,row:g.row,col:g.col,rowSpan:g.rowSpan,colSpan:g.colSpan,w:null,h:null,lit:!!p.lit,tenant:"",
      contract:"ไม่ทราบสถานะ-รอตรวจสอบ",condition:"ยังไม่ตรวจ",createdAt:now,updatedAt:now}; ops.push([db.doc("slots/"+id),d]); created.push({id,...d}); });
  for(let i=0;i<ops.length;i+=400){ const b=db.batch(); ops.slice(i,i+400).forEach(([r,d,m])=>m==="delete"?b.delete(r):m==="update"?b.update(r,d):b.set(r,d)); await b.commit(); }
  if(canEditZone(p.zoneId)) plan.del.forEach(s=>db.doc("thumbs/"+s.id).delete().catch(()=>{}));
  plan.del.forEach(s=>delete S.slots[s.id]); plan.keep.forEach(([s,g])=>Object.assign(s,{rowSpan:g.rowSpan,colSpan:g.colSpan})); created.forEach(c=>S.slots[c.id]={...c,createdAt:new Date()});
  Object.assign(S.points[p.id],{rows:lay.rows,cols:lay.cols,regions:lay.regions,...extra});
  return created.length;
}

    if(S.points[P.id]) return toast("รหัสจุดนี้มีอยู่แล้ว ใช้ปุ่มถ่ายภาพตรวจของจุดเดิม หรือเปลี่ยนลำดับ/ฝั่ง");
    if(P.overviewOnly){ const btn=$("#go"); busy(btn,true,"กำลังบันทึก…");
      try{ if((await db.doc("points/"+P.id).get()).exists){ busy(btn,false); return toast("รหัสจุดนี้มีอยู่แล้ว",5000); }
        const now=FV.serverTimestamp(), point={branch:P.branch,zoneId:P.zoneId,typeCode:P.typeCode,structNo:P.structNo,side:P.side,sideName:P.sideName,road:P.road,direction:P.direction,
          rows:P.rows,cols:P.cols,lit:P.lit,regions:P.regions,overviewOnly:true,slotCount:0,status:"draft",createdBy:S.me.email,createdAt:now,updatedAt:now,lastInspection:{}};
        await db.doc("points/"+P.id).set(point); S.points[P.id]={id:P.id,...point}; }
      catch(e){ busy(btn,false); return toast(e.message,5000); }

    let ov; try{ ov=await takePhoto(`${P.id} ภาพรวม`,{mode:"overview"}); }catch(e){ if(e.message!=="cancel") toast(e.message,5000); return; }
    if(!checkGPS(b,ov.gps)) return;
    try{ if((await db.doc("points/"+P.id).get()).exists) return toast("รหัสจุดนี้มีอยู่แล้ว ใช้ปุ่มถ่ายภาพตรวจของจุดเดิม หรือเปลี่ยนลำดับ/ฝั่ง",5000); }catch(e){}
    const btn=$("#go"); busy(btn,true,"กำลังอัปโหลดภาพรวม…");
    try{ const j=await callScript(b.zoneId,{action:"upload",image:ov.full,branch:code,name:`${P.id}_overview_day`,month:monthKey()});
      const now=FV.serverTimestamp(), mk=monthKey(), point={branch:P.branch,zoneId:P.zoneId,typeCode:P.typeCode,structNo:P.structNo,side:P.side,sideName:P.sideName,road:P.road,direction:P.direction,
        rows:P.rows,cols:P.cols,lit:P.lit,regions:P.regions,slotCount:0,status:"draft",createdBy:S.me.email,createdAt:now,updatedAt:now,lastInspection:{dayOv:mk}};
      const bt=db.batch(); bt.set(db.doc("points/"+P.id),point); bt.set(db.doc("thumbs/"+P.id),{zoneId:P.zoneId,branch:P.branch,day:ov.thumb,dayUrl:j.url,dayMonth:mk}); await bt.commit();
      S.points[P.id]={id:P.id,...point,status:"draft"}; }

  };
}
function checkGPS(b, gps){
  if(!(b.lat&&b.lng)) return true;
  if(!gps){ toast("ไม่พบตำแหน่ง GPS เปิดการเข้าถึงตำแหน่งแล้วถ่ายใหม่",5000); return isSuper()||isAM(); }
  const d=haversine(b.lat,b.lng,gps.lat,gps.lng), R=b.radiusM||S.settings.gpsRadiusM;
  if(d>R){ toast(`ตำแหน่งห่างจากสาขา ${Math.round(d)} ม. เกินรัศมี ${R} ม.`,5000); return isSuper()||isAM(); }
  return true;
}
const cellLabel=g=>(g.rowSpan||1)*(g.colSpan||1)>1?`ช่องรวม แถว ${g.row}–${g.row+(g.rowSpan||1)-1} คอลัมน์ ${g.col}–${g.col+(g.colSpan||1)-1}`:`แถว ${g.row} คอลัมน์ ${g.col}`;
function regSlots(app,b,P,startAt){
  P=S.points[P.id]?{...S.points[P.id],id:P.id}:P;
  const regions=(P.regions||[]).slice().sort((a,c)=>a.row-c.row||a.col-c.col), mk=monthKey();
  const slotAt=g=>Object.values(S.slots).find(s=>s.pointId===P.id&&s.row===g.row&&s.col===g.col);
  let i=startAt!=null?startAt:regions.findIndex(g=>!slotAt(g)); if(i<0) i=regions.length;
  let last={w:"",h:"",lit:P.lit};
  const nextNo=idx=>{ const used=new Set(Object.values(S.slots).filter(s=>s.pointId===P.id).map(s=>s.no)); if(!used.has(idx+1)) return idx+1; let n=Math.max(0,...used)+1; return n; };
  const step=()=>{
    if(i>=regions.length) return regSave(app,b,P);
    const cell=regions[i], ex=slotAt(cell), sNo=ex?ex.no:nextNo(i), doneN=regions.filter(slotAt).length;
    const tmp=Object.values(S.slots).filter(s=>s.pointId===P.id).concat(regions.filter(g=>!slotAt(g)).map(g=>({...g,pending:true})));
    const v=ex||last;
    app.innerHTML=`<div class="row"><h1 class="grow">ลงทะเบียน ${esc(P.id)}</h1><button class="ghost" id="edd">แก้ไขข้อมูลจุด/ผัง</button></div><div class="card"><div class="stepbar"><i class="on"></i><i class="on"></i><i></i></div>
      <div class="step">ขั้นที่ 2 จาก 3 · ${cell.view?esc(cell.view):`ป้าย ${String(sNo).padStart(2,"0")} · ${cellLabel(cell)}`} · ถ่ายแล้ว ${doneN}/${regions.length} ${ex?'<span class="chip c-ok">ถ่ายแล้ว</span>':""}</div>
      <div style="margin:10px 0">${pylonHTML({...P},tmp,`${cell.row}-${cell.col}`)}</div>
      ${cell.view?`<p>ถ่าย<b>${esc(cell.view)}</b>ของจุดนี้ ให้เห็นป้ายทั้งหมดในภาพเดียว</p><input id="w" type="hidden"><input id="h" type="hidden"><input id="tn" type="hidden">`:`<div class="row"><div class="grow"><label>กว้าง (ซม.)</label><input id="w" type="number" value="${esc(v.w==null?"":v.w)}"></div><div class="grow"><label>สูง (ซม.)</label><input id="h" type="number" value="${esc(v.h==null?"":v.h)}"></div></div>
      <label>ชื่อร้าน/แบรนด์ที่เห็นบนป้าย (ไม่ทราบให้เว้นว่าง)</label><input id="tn" value="${esc(ex?ex.tenant||"":"")}">`}
      <label class="check"><input type="checkbox" id="sl" ${(cell.view?P.lit:v.lit)?"checked":""}> ${cell.view?"จุดนี้":"ป้ายนี้"}มีไฟ ${LIT_NOTE}</label>
      <div class="row" style="margin-top:10px"><button id="back">◀ ย้อนกลับ</button><button id="skip">${ex?"ถัดไป ▶":"ข้ามไปก่อน"}</button><button id="later" class="ghost">บันทึกไว้ทำต่อ</button><span class="grow"></span>
        <button class="sun" id="shot">${IC.cam}${ex?"ถ่ายใหม่":cell.view?"ถ่าย"+esc(cell.view):"ถ่ายภาพป้ายนี้"}</button></div></div>`;
    $("#edd").onclick=()=>editDraft(app,b,P);
    $("#back").onclick=()=>{ if(i>0){ i--; step(); } else editDraft(app,b,P); };
    $("#skip").onclick=async()=>{ if(ex){ const u={w:$("#w").value?Number($("#w").value):null,h:$("#h").value?Number($("#h").value):null,tenant:$("#tn").value.trim(),lit:$("#sl").checked};
        if(u.w!==ex.w||u.h!==ex.h||u.tenant!==(ex.tenant||"")||u.lit!==!!ex.lit){ try{ await db.doc("slots/"+ex.id).update({...u,updatedAt:FV.serverTimestamp()}); Object.assign(ex,u); }catch(e){ toast(e.message,4000); } } }
      i++; step(); };
    $("#later").onclick=()=>{ toast("บันทึกแล้ว กลับมากด “ทำต่อ” ที่หน้าสาขาได้",4000); go("branch/"+b.id); };
    $("#shot").onclick=async e=>{
      let ph; try{ ph=await takePhoto(`${P.id} ${cell.view||cellLabel(cell)}`,{mode:cell.view?"overview":"slot",aspect:(+$("#w").value&&+$("#h").value)?(+$("#w").value)/(+$("#h").value):null}); }catch(err){ if(err.message!=="cancel") toast(err.message); return; }
      busy(e.target,true,"กำลังอัปโหลด…");
      const sid=ex?ex.id:slotIdOf(P.id,sNo), now=FV.serverTimestamp();
      const info={w:$("#w").value?Number($("#w").value):null, h:$("#h").value?Number($("#h").value):null, lit:$("#sl").checked, tenant:$("#tn").value.trim()};
      try{ const r=await uploadSlot({id:sid,branch:b.id,zoneId:b.zoneId},"day",ph,"register");
        const photo={baseFileIdDay:r.fileId,baseUrlDay:r.url,lastFileId:r.fileId,lastUrl:r.url,lastInspectedAt:now,dayMonth:mk,updatedAt:now};
        const bt=db.batch();
        if(ex) bt.update(db.doc("slots/"+sid),{...info,...photo});
        else bt.set(db.doc("slots/"+sid),{pointId:P.id, branch:b.id, zoneId:b.zoneId, typeCode:P.typeCode, no:sNo, row:cell.row, col:cell.col, rowSpan:cell.rowSpan||1, colSpan:cell.colSpan||1,
          ...info, ...(cell.view?{view:cell.view,contract:"-"}:{contract:"ไม่ทราบสถานะ-รอตรวจสอบ"}), condition:"ยังไม่ตรวจ", ...photo, createdAt:now});
        bt.set(db.doc("thumbs/"+sid),{zoneId:b.zoneId,branch:b.id,baseDay:ph.thumb,last:ph.thumb},{merge:true});
        bt.set(db.collection("inspections").doc(),{slotId:sid,pointId:P.id,branch:b.id,zoneId:b.zoneId,shift:"day",month:mk,fileId:r.fileId,url:r.url,thumb:ph.thumb,status:"review",kind:"register",flags:gpsFlags(b,ph.gps),gps:ph.gps||null,takenBy:S.me.email,takenAt:now});
        await bt.commit();
        S.slots[sid]={...(ex||{id:sid,pointId:P.id,branch:b.id,zoneId:b.zoneId,typeCode:P.typeCode,no:sNo,row:cell.row,col:cell.col,rowSpan:cell.rowSpan||1,colSpan:cell.colSpan||1,condition:"ยังไม่ตรวจ",...(cell.view?{view:cell.view}:{})}),...info,...photo,lastInspectedAt:new Date()};
        last={w:info.w,h:info.h,lit:info.lit}; i++; step();
      }catch(err){ busy(e.target,false); toast(err.message,5000); }
    };
  };
  step();
}
/* แก้ข้อมูลจุดและผังของร่าง (ย้อนกลับจากขั้นถ่ายภาพ) */
function editDraft(app,b,P){
  P=S.points[P.id]?{...S.points[P.id],id:P.id}:P; const T=typeOf(P);
  app.innerHTML=`<div class="row"><h1 class="grow">แก้ไขร่าง ${esc(P.id)}</h1></div><div class="card"><div class="stepbar"><i class="on"></i><i></i><i></i></div><div class="step">ขั้นที่ 1 จาก 3 · แก้ไขข้อมูลจุดและผัง</div>
    <p class="muted">${esc(T.name)} ${esc(P.structNo)}${P.side&&P.side!=="-"?" · ฝั่ง "+esc(P.side):""} · ประเภท ลำดับ และฝั่ง แก้ไม่ได้ ถ้าเลือกผิดให้ลบร่างแล้วลงทะเบียนใหม่</p>
    <label>${T.side?"ชื่อฝั่ง/ชื่อประตู":"ชื่อตำแหน่ง"}</label><input id="esn" value="${esc(P.sideName||"")}">
    ${T.road?`<label>ถนน</label><input id="erd" value="${esc(P.road||"")}">`:""}
    ${T.dir?`<label>ทิศทางจราจร</label><select id="edr">${["","ขาเข้า","ขาออก"].map(o=>`<option ${P.direction===o?"selected":""} value="${o}">${o||"-"}</option>`).join("")}</select>`:""}
    <label class="check"><input type="checkbox" id="elit" ${P.lit?"checked":""}> จุดนี้มีป้ายไฟ ${LIT_NOTE}</label>
    ${P.overviewOnly?"":`<div id="ele"></div>`}
    <div class="row" style="margin-top:10px"><button id="ecancel">◀ กลับไปถ่ายภาพ</button><span class="grow"></span><button class="pri" id="esave">บันทึกแล้วถ่ายต่อ</button></div></div>`;
  const ed=P.overviewOnly?null:layoutEditor($("#ele"),{rows:P.rows,cols:P.cols,regions:P.regions});
  $("#ecancel").onclick=()=>regSlots(app,b,P);
  $("#esave").onclick=async e=>{
    const extra={sideName:$("#esn").value.trim(),lit:$("#elit").checked}; if($("#erd")) extra.road=$("#erd").value.trim(); if($("#edr")) extra.direction=$("#edr").value;
    try{ busy(e.target,true);
      if(ed){ const lay=ed.get(); if(!lay.regions.length){ busy(e.target,false); return toast("ผังต้องมีอย่างน้อย 1 ป้าย"); }
        const plan=layoutPlan(P.id,lay);
        if(plan.del.length&&!(await confirmBox(`ป้ายที่ถ่ายไว้แล้ว ${plan.del.length} ป้ายจะถูกลบเพราะไม่อยู่ในผังใหม่ ยืนยัน?`))){ busy(e.target,false); return; }
        await commitLayout(P,lay,plan,extra,false);
      } else { await db.doc("points/"+P.id).update({...extra,updatedAt:FV.serverTimestamp()}); Object.assign(S.points[P.id],extra); }
      toast("บันทึกแล้ว"); regSlots(app,b,{...S.points[P.id],id:P.id});
    }catch(err){ busy(e.target,false); toast(err.message,5000); }
  };
}
async function regSave(app,b,P){
  P=S.points[P.id]?{...S.points[P.id],id:P.id}:P;
  const regions=(P.regions||[]).slice().sort((a,c)=>a.row-c.row||a.col-c.col), ss=Object.values(S.slots).filter(s=>s.pointId===P.id);

   <div class="row"><button id="bk">◀ ย้อนกลับ</button><button class="ghost" id="edd">แก้ไขข้อมูลจุด/ผัง</button><span class="grow"></span><button class="pri" id="save" ${ss.length?"":"disabled"}>จบการลงทะเบียน</button></div></div>`;

  $("#save").onclick=async e=>{
    if(left.length&&!(await confirmBox(`เอา ${left.length} ตำแหน่งที่ยังไม่ได้ถ่ายออกจากผัง (ถือว่าไม่ใช่ป้าย)?`))) return;

async function viewInspect(app, pid, sub){

  const dayOK=!st.enforceTime||(h>=st.dayStart&&h<st.dayEnd), nightOK=!st.enforceTime||(h>=st.nightStart&&h<st.nightEnd);
  const ss=Object.values(S.slots).filter(s=>s.pointId===pid), lit=ss.filter(s=>s.lit);

    app.innerHTML=`${head}<h1>ถ่ายใหม่</h1><div class="muted" style="margin-top:-8px;margin-bottom:12px">${esc(pid)} · ${rt.length} ป้าย ไม่ต้องถ่ายภาพรวม</div>
     <div class="card"><div class="row">${sh.map(x=>{ const ok=x==="day"?dayOK:nightOK; return `<button class="sun" data-sh="${x}" data-ok="${ok?1:0}" ${ok?"":'style="opacity:.5"'}>${IC.cam}รอบ${x==="day"?"กลางวัน":"กลางคืน"} (${rt.filter(s=>s.retake.shift===x).length})</button>`; }).join("")}</div></div>`;
    $$("[data-sh]",app).forEach(x=>x.onclick=()=>{ if(x.dataset.ok!=="1") return toast(tmsg(x.dataset.sh==="day"),4500); runInspect(app,p,b,x.dataset.sh,{retake:true}); });
    return;
  }
  const dLeft=ss.filter(s=>!slotDone(s,"day",mk)), nLeft=lit.filter(s=>!slotDone(s,"night",mk)&&(slotDone(s,"day",mk)||!s.nightMonth));
  app.innerHTML=`${head}<h1>ถ่ายภาพรอบเดือน</h1><div class="muted" style="margin-top:-8px;margin-bottom:12px">${esc(pid)} · ${esc(typeOf(p).name)} ${esc(p.structNo)} · ${esc(p.sideName||"")}</div>
   <div class="card" style="${rd.open?"background:var(--sun-l);border-color:#F0D78A":"background:var(--bad-bg);border-color:#F3B4B6"}">รอบถ่ายภาพ <b>${rd.label}</b> · ${rd.open?"เปิดอยู่":rd.before?"ยังไม่ถึงรอบ ถ่ายรอบเดือนไม่ได้":"ปิดรอบแล้ว ถ่ายรอบเดือนไม่ได้"}</div>
   <div class="card"><h2 style="margin-top:0">☀️ กลางวัน · ${p.overviewOnly?"ภาพรวม "+ss.map(s=>s.view).filter(Boolean).join(" + "):"ทุกป้าย"}</h2><p>ถ่ายแล้ว ${ss.length-dLeft.length}/${ss.length} ป้าย</p>
     <div class="row"><button class="sun" data-run="day">${IC.cam}${dLeft.length===ss.length?"เริ่มถ่าย":dLeft.length?`ทำต่อ (เหลือ ${dLeft.length})`:"ถ่ายครบแล้ว · ถ่ายซ้ำทั้งหมด"}</button></div>

   ${lit.length?`<div class="card"><h2 style="margin-top:0">🌙 กลางคืน · เฉพาะป้ายไฟ</h2><p>ถ่ายแล้ว ${lit.length-nLeft.length}/${lit.length} ป้าย ${nLeft.length?`<span class="chip c-bad">งานค้าง ${nLeft.length}</span>`:""}</p>
     <div class="row"><button class="pri" data-run="night" style="background:var(--lotus-dd);border-color:var(--lotus-dd)" ${nLeft.length?"":"disabled"}>${IC.cam}${nLeft.length?`ถ่ายกลางคืน (${nLeft.length})`:"ถ่ายครบแล้ว"}</button></div>

async function runInspect(app,p,b,shift,opt={}){
  const shTH=shift==="day"?"กลางวัน":"กลางคืน", mk=monthKey(), li=p.lastInspection||{};
  if(!opt.retake&&!p.overviewOnly&&li[shift+"Ov"]!==mk){
    let ov; try{ ov=await takePhoto(`${p.id} ภาพรวม ${shTH}`,{mode:"overview"}); }catch(e){ if(e.message!=="cancel") toast(e.message); return; }
    if(!checkGPS(b,ov.gps)) return;
    app.innerHTML=`<div class="card">กำลังอัปโหลดภาพรวม…</div>`;
    try{ const ovr=await callScript(p.zoneId,{action:"upload",image:ov.full,branch:p.branch,name:`${p.id}_overview_${shift}`,month:mk});
      const bt=db.batch(); bt.set(db.doc("thumbs/"+p.id),{zoneId:p.zoneId,branch:p.branch,[shift]:ov.thumb,[shift+"Url"]:ovr.url,[shift+"Month"]:mk},{merge:true});
      bt.update(db.doc("points/"+p.id),{["lastInspection."+shift+"Ov"]:mk,updatedAt:FV.serverTimestamp()}); await bt.commit();
      p.lastInspection={...li,[shift+"Ov"]:mk}; }
    catch(e){ toast(e.message,5000); return go("inspect/"+p.id); }
  }
  const all=Object.values(S.slots).filter(s=>s.pointId===p.id).sort((a,c)=>a.row-c.row||a.col-c.col);
  const queue=all.filter(s=>opt.retake?(s.retake&&s.retake.shift===shift):shift==="night"?(s.lit&&(opt.all||!slotDone(s,"night",mk))):(opt.all||!slotDone(s,"day",mk)));
  let i=0; const results=[];
  const step=()=>{
    if(i>=queue.length) return finish();
    const s=queue[i];
    app.innerHTML=`<h1>${esc(p.id)} · ${shTH}</h1><div class="card"><div class="step">${s.view?esc(s.view):"ป้าย "+String(s.no).padStart(2,"0")} · ${i+1} จาก ${queue.length}</div><div class="prog" style="margin:6px 0 4px"><i style="width:${Math.round(i/queue.length*100)}%"></i></div>
     <div style="margin:10px 0">${pylonHTML(p,all,`${s.row}-${s.col}`)}</div>
     <p>ร้านในทะเบียน: <b>${esc(s.tenant||"-")}</b> · สภาพล่าสุด ${chip(s.condition)}</p>
     ${s.retake?`<p class="red">ถ่ายใหม่: ${esc(s.retake.reason||"")}</p>`:""}
     <div class="row"><button id="skip">ถ่ายไม่ได้</button><button id="later">บันทึกไว้ทำต่อ</button><span class="grow"></span><button class="sun" id="shot">${IC.cam}${s.view?"ถ่าย"+esc(s.view):"ถ่ายป้ายนี้"}</button></div></div>`;
    $("#later").onclick=()=>{ toast("บันทึกแล้ว ป้ายที่ถ่ายไปแล้วไม่ต้องถ่ายซ้ำ",4000); go("branch/"+p.branch); };
    $("#skip").onclick=async()=>{ const why=prompt("เหตุผลที่ถ่ายไม่ได้ เช่น มีรถบัง, ป้ายถูกรื้อ"); if(!why) return;
      results.push({s,skip:why}); await db.collection("inspections").add({slotId:s.id,pointId:p.id,branch:s.branch,zoneId:s.zoneId,shift,month:mk,status:"review",kind:"skip",note:why,takenBy:S.me.email,takenAt:FV.serverTimestamp()}); i++; step(); };
    $("#shot").onclick=async e=>{
      let ph; try{ ph=await takePhoto(`${s.id} ${s.view||""} ${shTH}`,{mode:shift==="night"?"night":s.view?"overview":"slot",aspect:(s.w&&s.h)?s.w/s.h:null}); }catch(err){ if(err.message!=="cancel") toast(err.message); return; }
      if(!checkGPS(b,ph.gps)) return;
      busy(e.target,true,"กำลังอัปโหลด…");
      try{
        const r=await uploadSlot(s,shift,ph), now=FV.serverTimestamp(), noBase=shift==="night"?!s.baseFileIdNight:!s.baseFileIdDay;
        const su={lastFileId:r.fileId,lastUrl:r.url,lastInspectedAt:now,updatedAt:now,[shift==="night"?"nightMonth":"dayMonth"]:mk}, tu={zoneId:s.zoneId,branch:s.branch,last:ph.thumb};
        if(noBase){ if(shift==="day"){su.baseFileIdDay=r.fileId; su.baseUrlDay=r.url; tu.baseDay=ph.thumb;} else {su.baseFileIdNight=r.fileId; su.baseUrlNight=r.url; tu.baseNight=ph.thumb;} }
        if(s.retake) su.retake=FV.delete();
        const b2=db.batch(); b2.update(db.doc("slots/"+s.id),su); b2.set(db.doc("thumbs/"+s.id),tu,{merge:true});
        b2.set(db.collection("inspections").doc(),{slotId:s.id,pointId:p.id,branch:s.branch,zoneId:s.zoneId,shift,month:mk,fileId:r.fileId,url:r.url,thumb:ph.thumb,
          status:"review",kind:opt.retake?"retake":noBase?"baseline":"monthly",flags:gpsFlags(b,ph.gps),gps:ph.gps||null,takenBy:S.me.email,takenAt:now});
        await b2.commit(); const lo={...su,lastInspectedAt:new Date()}; delete lo.retake; Object.assign(S.slots[s.id],lo); delete S.slots[s.id].retake;
        results.push({s}); i++; step();
      }catch(err){ busy(e.target,false); toast(err.message,5000); }
    };
  };
  const finish=async()=>{
    const allDone=shift==="night"?all.filter(s=>s.lit).every(s=>slotDone(s,"night",mk)):all.every(s=>slotDone(s,"day",mk));
    if(allDone&&!opt.retake){ await db.doc("points/"+p.id).update({["lastInspection."+shift]:mk,updatedAt:FV.serverTimestamp()}); p.lastInspection={...(p.lastInspection||{}),[shift]:mk}; }
    const litLeft=shift==="day"?all.filter(s=>s.lit&&!slotDone(s,"night",mk)).length:0;
    app.innerHTML=`<h1>ส่งภาพ ${esc(p.id)} แล้ว</h1><div class="card"><p>${results.length} ภาพ · ส่งให้ AM ตรวจภาพแล้ว</p>
     ${results.map(r=>`<div class="row" style="border-bottom:1px solid #edf1f0;padding:6px 0"><span class="grow">ป้าย ${String(r.s.no).padStart(2,"0")} ${esc(r.s.tenant||"")}</span>${r.skip?`<span class="chip c-none">ถ่ายไม่ได้</span>`:'<span class="chip c-ok">ส่งแล้ว</span>'}</div>`).join("")}
     ${litLeft?`<div class="card" style="margin-top:10px;background:#E7ECF7;border-color:#C5D0EA">🌙 มีงานถ่ายกลางคืน ${litLeft} ป้ายไฟ ถ่ายได้ ${S.settings.nightStart}:00–${S.settings.nightEnd}:00 น.</div>`:""}
     <div class="row" style="justify-content:flex-end;margin-top:10px"><button class="pri" id="back">กลับหน้าสาขา</button></div></div>`;
    $("#back").onclick=async()=>{ await loadAll(); go("branch/"+p.branch); };
  };
  step();
}

const REJECT_REASONS=["ภาพไม่ชัด / มืด / ย้อนแสง","ป้ายไม่อยู่ในภาพหรือเห็นไม่ครบ","ถ่ายผิดช่อง / ผิดฝั่ง","ติดป้ายข้างเคียงมากเกินไป","รอบกลางคืนแต่ไฟยังไม่เปิด"];
function rejectModal(r, onDone){
  const m=modal(`<h2 style="margin-top:0">ส่งกลับให้ถ่ายใหม่</h2><p class="muted">${esc(r.slotId)} · ${r.shift==="night"?"กลางคืน":"กลางวัน"} สาขาจะเห็นช่องนี้เป็น “ถ่ายใหม่” ในหน้าสาขา</p>
    <div class="roles">${REJECT_REASONS.map((t,i)=>`<label class="ropt"><input type="radio" name="rr" value="${esc(t)}" ${i===0?"checked":""}><span><b>${esc(t)}</b></span></label>`).join("")}
    <label class="ropt"><input type="radio" name="rr" value="_"><span><b>อื่น ๆ</b></span></label></div>
    <input id="rro" placeholder="ระบุเหตุผลเพิ่มเติม (ไม่บังคับ)" style="margin-top:8px">
    <div class="row" style="justify-content:flex-end;margin-top:12px"><button data-c>ยกเลิก</button><button class="dan" data-s>ส่งกลับ</button></div>`);
  $("[data-c]",m.el).onclick=m.close;
  $("[data-s]",m.el).onclick=async e=>{ let why=$("input[name=rr]:checked",m.el).value; const extra=$("#rro",m.el).value.trim();
    if(why==="_"){ if(!extra) return toast("ระบุเหตุผล"); why=extra; } else if(extra) why+=" · "+extra;
    busy(e.target,true); try{ await rejectReview(r,why); m.close(); toast("ส่งกลับให้สาขาถ่ายใหม่แล้ว"); onDone&&onDone(); }catch(err){ busy(e.target,false); toast(err.message,5000); } };
}
async function rejectReview(r, why){
  const now=FV.serverTimestamp(), b=db.batch(), retake={shift:r.shift||"day",reason:why,by:S.me.email,at:TSx.now()};
  b.update(db.doc("inspections/"+r.id),{status:"rejected",rejectReason:why,reviewedBy:S.me.email,reviewedAt:now});
  if(S.slots[r.slotId]){ b.update(db.doc("slots/"+r.slotId),{retake,updatedAt:now}); S.slots[r.slotId].retake=retake; }
  await b.commit(); delete S.reviews[r.id];
}
async function confirmReview(r, finalCond, setBase){
  const s=S.slots[r.slotId]; const now=FV.serverTimestamp(); const b=db.batch();
  b.update(db.doc("inspections/"+r.id),{status:"confirmed",finalCondition:finalCond,reviewedBy:S.me.email,reviewedAt:now});
  if(s){
    const su={condition:finalCond,updatedAt:now};
    if(setBase&&r.fileId){ if(r.shift==="night"){su.baseFileIdNight=r.fileId; su.baseUrlNight=r.url;} else {su.baseFileIdDay=r.fileId; su.baseUrlDay=r.url;} b.set(db.doc("thumbs/"+s.id),{[r.shift==="night"?"baseNight":"baseDay"]:r.thumb,zoneId:s.zoneId,branch:s.branch},{merge:true}); }
    b.update(db.doc("slots/"+s.id),su); Object.assign(s,{condition:finalCond});
    const hasOpen=Object.values(S.tickets).some(t=>t.slotId===s.id&&t.category===finalCond);
    if(r.kind==="skip") { await b.commit(); return; }
    if(!NO_TICKET.includes(finalCond)&&!hasOpen){
      const sla=S.settings.sla[finalCond]||7, ref=db.collection("tickets").doc();
      const t={slotId:s.id,pointId:s.pointId,branch:s.branch,zoneId:s.zoneId,category:finalCond,shift:r.shift||"day",tenant:s.tenant||"",slaDays:sla,
        status:"open",createdAt:TSx.now(),dueAt:TSx.fromDate(addDays(new Date(),sla)),lastProgressAt:TSx.now(),progress:[],createdBy:S.me.email,inspectionId:r.id,beforeUrl:r.url||""};
      b.set(ref,t); S.tickets[ref.id]={id:ref.id,...t};
    }
  }
  await b.commit();
}

}

function closeTicket(t){
  const s=S.slots[t.slotId]; if(!s) return toast("ไม่พบช่องป้ายนี้ในทะเบียน");
  if(t.category==="ไม่มีสัญญา"){
    const m=modal(`<h2 style="margin-top:0">ปิดงาน ป้ายไม่มีสัญญา</h2><p class="muted">${esc(t.slotId)} · ร้าน ${esc(s.tenant||"-")}</p>
      <label>สถานะสัญญาปัจจุบัน</label><select id="nc">${CONTRACT.filter(c=>c!==NO_CONTRACT).map(c=>`<option>${esc(c)}</option>`).join("")}</select>
      <label>Unit ใน Simplicity</label><input id="nu" value="${esc(s.unit||"")}">
      <div class="row" style="justify-content:flex-end;margin-top:10px"><button data-c>ยกเลิก</button><button class="pri" data-s>ปิดงาน</button></div>`);
    $("[data-c]",m.el).onclick=m.close;
    $("[data-s]",m.el).onclick=async()=>{ const u={contract:$("#nc",m.el).value,unit:$("#nu",m.el).value.trim(),updatedAt:FV.serverTimestamp()}; const b=db.batch();
      b.update(db.doc("slots/"+s.id),u); b.update(db.doc("tickets/"+t.id),{status:"closed",result:u.contract,closedBy:S.me.email,closedAt:FV.serverTimestamp(),updatedAt:FV.serverTimestamp()});
      await b.commit(); Object.assign(s,u); delete S.tickets[t.id]; m.close(); toast("ปิดใบงานแล้ว"); render(); };
    return;
  }
  const m=modal(`<h2 style="margin-top:0">ปิดงาน ${esc(t.slotId)}</h2><p>ปัญหา: ${chip(t.category)}</p>
   <label>สภาพหลังแก้</label><select id="res"><option value="ปกติ">ปกติ (ซ่อม/เปลี่ยนแล้ว)</option><option value="ป้ายทดแทน">ขึ้นป้ายทดแทนแล้ว</option></select>
   <div id="fw" hidden><label>ชื่อป้ายทดแทน</label><input id="ftn" placeholder="True / Food Court / Pharmacy"></div>
   <p class="muted">ถ่ายภาพ${t.shift==="night"?"ตอนกลางคืนเมื่อเปิดไฟแล้ว":""}หลังแก้ ${canReview(t)?"แล้วปิดงานได้ทันที":"แล้วส่งให้ AM อนุมัติปิด"}</p>
   <div class="row" style="justify-content:flex-end"><button data-c>ยกเลิก</button><button class="sun" data-go>${IC.cam}ถ่ายภาพหลังแก้</button></div>`);
  $("#res",m.el).onchange=()=>{$("#fw",m.el).hidden=$("#res",m.el).value!=="ป้ายทดแทน";};
  $("[data-c]",m.el).onclick=m.close;
  $("[data-go]",m.el).onclick=async e=>{
    const result=$("#res",m.el).value, ftn=$("#ftn",m.el).value.trim();
    if(result==="ป้ายทดแทน"&&!ftn) return toast("ใส่ชื่อป้ายทดแทน");
    let ph; try{ ph=await takePhoto(`${t.slotId} หลังแก้`,{mode:t.shift==="night"?"night":s.view?"overview":"slot",aspect:(s.w&&s.h)?s.w/s.h:null}); }catch(err){ if(err.message!=="cancel") toast(err.message); return; }
    busy(e.target,true,"กำลังอัปโหลด…");
    try{
      const r=await uploadSlot(s,t.shift||"day",ph,"after");
      const after={afterFileId:r.fileId,afterUrl:r.url,result,afterTenant:ftn||null,closedBy:S.me.email,closedAt:FV.serverTimestamp(),updatedAt:FV.serverTimestamp()};
      Object.assign(t,after,{afterThumb:ph.thumb});
      if(canReview(t)){ await finalizeClose(t,result,ftn,ph.thumb); toast("ปิดใบงานแล้ว"); }
      else { await db.doc("tickets/"+t.id).update({...after,status:"pending_close"}); t.status="pending_close"; toast("ส่งให้ AM อนุมัติปิดแล้ว",4000); }
      m.close(); render();
    }catch(err){ busy(e.target,false); toast(err.message,5000); }
  };
}
async function finalizeClose(t, result, ftn, thumb){
  const s=S.slots[t.slotId]; const now=FV.serverTimestamp(); const b=db.batch();
  b.update(db.doc("tickets/"+t.id),{status:"closed",result,afterFileId:t.afterFileId||null,afterUrl:t.afterUrl||null,afterTenant:ftn||null,closedBy:t.closedBy||S.me.email,closedAt:now,updatedAt:now});
  if(s){
    const su={condition:result,updatedAt:now}, night=t.shift==="night";
    if(t.afterFileId){ su.lastFileId=t.afterFileId; su.lastUrl=t.afterUrl; su.lastInspectedAt=now;
      if(night){su.baseFileIdNight=t.afterFileId; su.baseUrlNight=t.afterUrl;} else {su.baseFileIdDay=t.afterFileId; su.baseUrlDay=t.afterUrl;} }
    if(result==="ป้ายทดแทน"&&ftn){ su.tenant=ftn; su.contract="ไม่มีสัญญา-ติดฟรี (ทดแทน)"; }
    b.update(db.doc("slots/"+s.id),su); Object.assign(s,su);
    if(thumb) b.set(db.doc("thumbs/"+s.id),{zoneId:s.zoneId,branch:s.branch,last:thumb,[night?"baseNight":"baseDay"]:thumb},{merge:true});
  }
  await b.commit(); delete S.tickets[t.id];
}

      if(!code&&!zId&&!rmId) continue;
      if(!rmId||!zId||!code||!name){ rep.push(`ข้ามแถวสาขา ${code||"-"}: ข้อมูลไม่ครบ (ต้องมีรหัส RM, รหัสเขต, รหัสและชื่อสาขา)`); continue; }
      if(!idOk(rmId)||!idOk(zId)){ rep.push(`ข้ามสาขา ${code}: รหัส RM/เขต ใช้ได้เฉพาะ A–Z 0–9 - _`); continue; }
      if(zones[zId]&&zones[zId].rmId!==rmId){ rep.push(`ข้ามสาขา ${code}: เขต ${zId} อยู่ในหลาย RM ในไฟล์`); continue; }
      if(brs[code]){ rep.push(`ข้ามสาขา ${code}: รหัสซ้ำในไฟล์`); continue; }
      const ex=S.branches[code];
      if(ex&&ex.zoneId!==zId&&Object.values(S.slots).some(s=>s.branch===code)){ rep.push(`ไม่ย้ายสาขา ${code}: มีผังป้ายอยู่ในเขต ${ex.zoneId} แล้ว ให้ย้ายด้วยตนเอง`); continue; }
      rms[rmId]={name:rmName||(rms[rmId]||{}).name||rmId};
      zones[zId]={name:amName?`AM ${amName}`:zId, amName, rmId};
      brs[code]={zoneId:zId,name,format:fmt||"Lotus's",lat:num(lat),lng:num(lng),...(num(rad)?{radiusM:num(rad)}:{})};
      if(amMail){ if(mailOk(amMail)) users[amMail.toLowerCase()]={role:"am",zoneId:zId,rmId:"",name:amName}; else rep.push(`Gmail AM ไม่ถูกต้อง: ${amMail}`); }
      if(rmMail){ if(mailOk(rmMail)) users[rmMail.toLowerCase()]={role:"rm",zoneId:"",rmId,name:rmName}; else rep.push(`Gmail RM ไม่ถูกต้อง: ${rmMail}`); }
    }
    const existing={}; (await db.collection("users").get()).forEach(d=>existing[d.id]=d.data());
    Object.keys(users).forEach(e=>{ if(existing[e]&&["super","viewer"].includes(existing[e].role)){ rep.push(`ไม่เปลี่ยนสิทธิ์ ${e}: เป็น ${ROLE_TH[existing[e].role]} อยู่แล้ว`); delete users[e]; } });
    const allZones=z=>Object.keys({...Object.fromEntries(Object.entries(S.zones).filter(([,v])=>v.rmId===z)),...Object.fromEntries(Object.entries(zones).filter(([,v])=>v.rmId===z))});
    const cnt=(o,base)=>{ const k=Object.keys(o); return `${k.length} (ใหม่ ${k.filter(x=>!base[x]).length})`; };
    out.innerHTML=`<div class="kpis" style="margin-top:10px"><div class="kpi"><span>RM</span><b>${cnt(rms,S.rms)}</b></div><div class="kpi"><span>เขต AM</span><b>${cnt(zones,S.zones)}</b></div>
      <div class="kpi"><span>สาขา</span><b>${cnt(brs,S.branches)}</b></div><div class="kpi"><span>บัญชีผู้ใช้</span><b>${cnt(users,existing)}</b></div></div>
      ${rep.length?`<details open><summary class="red">ต้องตรวจ ${rep.length} รายการ</summary><ul class="muted">${rep.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>`:""}
      <div class="row" style="justify-content:flex-end"><button class="pri" id="sxgo">ยืนยันนำเข้า</button></div>`;
    $("#sxgo",out).onclick=async e=>{
      busy(e.target,true,"กำลังนำเข้า…"); const now=FV.serverTimestamp(), ops=[];
      Object.entries(rms).forEach(([id,v])=>ops.push([db.doc("rms/"+id),{...v,updatedAt:now},"merge"]));
      Object.entries(zones).forEach(([id,v])=>ops.push([db.doc("zones/"+id),{...v,updatedAt:now},"merge"]));
      Object.entries(brs).forEach(([id,v])=>ops.push([db.doc("branches/"+id),{...v,updatedAt:now},"merge"]));
      Object.entries(users).forEach(([id,v])=>ops.push([db.doc("users/"+id),{name:v.name,role:v.role,zoneId:v.zoneId,rmId:v.rmId,
        branches:[],zones:v.role==="rm"?allZones(v.rmId):[],active:true,updatedBy:S.me.email,updatedAt:now},"merge"]));
      try{ await commitOps(ops); await loadAll(); await syncRMUsers(Object.keys(rms)); toast(`นำเข้าแล้ว ${Object.keys(brs).length} สาขา`,4000); render(); }
      catch(err){ busy(e.target,false); toast("นำเข้าไม่สำเร็จ: "+err.message,6000); }
    };
  }catch(err){ out.innerHTML=`<p class="red">${esc(err.message)}</p>`; }
}

/* ================= นำเข้า Excel ตามแม่แบบ ================= */
function xDate(v){ if(!v) return ""; if(v instanceof Date) return new Date(v.getTime()-v.getTimezoneOffset()*60000).toISOString().slice(0,10); if(typeof v==="number"){ const d=new Date(Math.round((v-25569)*86400e3)); return d.toISOString().slice(0,10);} return String(v).slice(0,10); }
async function importExcel(file, zid, out){
  if(!file) return; out.innerHTML='<p class="muted">กำลังอ่านไฟล์…</p>';
  try{
    const wb=XLSX.read(await file.arrayBuffer(),{cellDates:true});
    const rows=n=>{ const ws=wb.Sheets[n]; if(!ws) throw new Error(`ไม่พบชีต “${n}” ใช้ไฟล์แม่แบบทะเบียนป้าย`); return XLSX.utils.sheet_to_json(ws,{header:1,defval:"",raw:true}).slice(3); };
    const str=v=>String(v==null?"":v).trim();
    const typeCodeOf=v=>{ const n=parseInt(str(v),10); const t=TYPES.find(t=>t.n===n); return t?t.code:null; };
    const br=rows("สาขา").filter(r=>str(r[0])&&str(r[1]));
    const pts=rows("จุดป้าย").filter(r=>str(r[1])&&str(r[3])&&str(r[13])!=="แถวตัวอย่าง");
    const sls=rows("ช่องป้าย").filter(r=>str(r[1])&&str(r[4])&&str(r[21])!=="แถวตัวอย่าง");
    const report=[], ops=[], now=FV.serverTimestamp(); const okBranch=new Set();
    const zoneOfBranch=code=>S.branches[code]?S.branches[code].zoneId:null;
    for(const r of br){ const code=str(r[0]); const z=zoneOfBranch(code);
      if(z&&z!==zid){ report.push(`ข้ามสาขา ${code}: อยู่ในเขต ${z}`); continue; } okBranch.add(code);
      ops.push([db.doc("branches/"+code),{zoneId:zid,name:str(r[1]),format:str(r[2])||"Lotus's",updatedAt:now},"merge"]); }
    const pointIds=new Set(), ptInfo={};
    for(const r of pts){ const code=str(r[1]); if(!okBranch.has(code)&&zoneOfBranch(code)!==zid){ report.push(`ข้ามจุดของสาขา ${code}: ไม่ใช่สาขาในเขตนี้`); continue; }
      const tc=typeCodeOf(r[3]); if(!tc){ report.push(`ข้ามแถวจุด: ประเภทป้าย “${str(r[3])}” ไม่ถูกต้อง`); continue; }
      const sn=parseInt(r[4],10)||1, side=str(r[5])||"-", id=pointIdOf(code,tc,sn,side);
      pointIds.add(id); ptInfo[id]={branch:code,typeCode:tc};
      ops.push([db.doc("points/"+id),{branch:code,zoneId:zid,typeCode:tc,structNo:sn,side,sideName:str(r[6]),road:str(r[7]),direction:str(r[8]),lit:str(r[9])==="มีไฟ",
        slotCount:parseInt(r[10],10)||0,status:"approved",source:"import",createdBy:S.me.email,updatedAt:now},"merge"]); }
    const maxRC={}; let nSlot=0;
    for(const r of sls){ const pid=str(r[1]); const info=ptInfo[pid]||(S.points[pid]&&S.points[pid].zoneId===zid?S.points[pid]:null);
      if(!info){ report.push(`ข้ามช่อง ${pid}: ไม่พบรหัสจุดในไฟล์หรือในระบบ`); continue; }
      const no=parseInt(r[4],10); if(!no){ report.push(`ข้ามช่องของ ${pid}: ไม่มีลำดับช่อง`); continue; }
      const row=parseInt(r[5],10)||1, col=parseInt(r[6],10)||no; const id=slotIdOf(pid,no);
      maxRC[pid]={rows:Math.max(row,(maxRC[pid]||{}).rows||1),cols:Math.max(col,(maxRC[pid]||{}).cols||1)};
      const cond=COND.includes(str(r[19]))?str(r[19]):"ยังไม่ตรวจ", contract=CONTRACT.includes(str(r[12]))?str(r[12]):"ไม่ทราบสถานะ-รอตรวจสอบ";
      ops.push([db.doc("slots/"+id),{pointId:pid,branch:info.branch,zoneId:zid,typeCode:info.typeCode,no,row,col,w:Number(r[7])||null,h:Number(r[8])||null,lit:str(r[10])==="มีไฟ",
        tenant:str(r[11]),contract,unit:str(r[13]),rent:r[14]===""?null:Number(r[14]),start:xDate(r[15]),end:xDate(r[16]),install:xDate(r[17]),condition:cond,contentExpiry:xDate(r[20]),note:str(r[21]),source:"import",updatedAt:now},"merge"]);
      nSlot++; }
    Object.entries(maxRC).forEach(([pid,v])=>ops.push([db.doc("points/"+pid),v,"merge"]));
    out.innerHTML=`<p>พบ สาขา ${okBranch.size} · จุด ${pointIds.size} · ช่อง ${nSlot}</p>${report.length?`<details><summary>ข้าม ${report.length} รายการ</summary><ul class="muted">${report.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></details>`:""}
      <div class="row" style="justify-content:flex-end"><button class="pri" id="xgo" ${ops.length?"":"disabled"}>นำเข้า</button></div>`;
    $("#xgo",out).onclick=async e=>{ busy(e.target,true,"กำลังนำเข้า…"); try{ await commitOps(ops); await loadAll(); toast("นำเข้าเสร็จแล้ว"); render(); }catch(err){ busy(e.target,false); toast(err.message,6000);} };
  }catch(err){ out.innerHTML=`<p class="red">${esc(err.message)}</p>`; }
}

/* ================= เข้าสู่ระบบ ================= */
function viewLogin(msg){
  BOOTED=true; $("#hdr").hidden=true;
  const tiles=["ok","fill","ok","bad","empty","ok","ok","warn","ok"].map(c=>`<div class="tile c-${c}${c==="empty"?" empty":""}" style="min-width:46px;min-height:30px"></div>`).join("");
  $("#app").style.padding="0"; $("#app").style.maxWidth="none";
  $("#app").innerHTML=`${IN_APP?'<div class="card" style="margin:0;border-radius:0;background:var(--sun-l);border-color:#F0D78A">เปิดผ่านแอปอื่นอยู่ กล้องอาจใช้ไม่ได้ กด ⋯ มุมขวาบน แล้วเลือก <b>เปิดใน Safari</b> หรือ <b>Chrome</b></div>':""}<div class="login-wrap"><div class="login-top"><div class="pylon" aria-hidden="true"><div class="pgrid" style="grid-template-columns:repeat(3,46px)">${tiles}</div></div><div class="legs" style="width:120px" aria-hidden="true"><i></i><i></i></div>
    <h1>${esc(C.appName||"ตรวจป้าย")}</h1><p>ติดตามสภาพป้ายร้านค้า Pylon อาคาร และป้ายไฟ</p>
    <div class="brands"><span class="fmt fmt-lotus">Lotus's</span><span class="fmt fmt-makro">Makro</span><span class="fmt fmt-talad">Talad Super</span></div></div>
    <div class="login-card">${msg?`<div class="card" style="text-align:left">${msg}</div>`:""}<button class="sun" id="gl" style="width:100%;min-height:52px;font-size:17px">เข้าสู่ระบบด้วย Gmail</button>
    <p class="muted" style="text-align:center;margin:14px 0 0">ใช้ Gmail ที่ AM ของเขตเพิ่มสิทธิ์ไว้แล้ว · v${VERSION}</p></div></div>`;
  $("#gl").onclick=()=>auth.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>{ if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment") auth.signInWithRedirect(new firebase.auth.GoogleAuthProvider()); else toast(e.message,5000); });
}
$("#logout").innerHTML=IC.out; $("#logout").onclick=()=>auth.signOut();
auth.onAuthStateChanged(async u=>{
  S.user=u; S.me=null;
  if(!u) return viewLogin();
  const email=u.email.toLowerCase();
  try{
    let d=await db.doc("users/"+email).get();
    if(!d.exists&&(C.superAdmins||[]).map(x=>x.toLowerCase()).includes(email)){ await db.doc("users/"+email).set({name:u.displayName||"",role:"super",zoneId:"",branches:[],active:true,createdAt:FV.serverTimestamp()}); d=await db.doc("users/"+email).get(); }
    if(!d.exists||!d.data().active) return viewLogin(`บัญชี <b>${esc(email)}</b> ยังไม่ได้รับสิทธิ์ใช้งาน ส่ง Gmail นี้ให้ AM ของเขตเพื่อเพิ่มสิทธิ์ <div style="margin-top:8px"><button onclick="auth.signOut()">ใช้ Gmail อื่น</button></div>`);
    S.me={email,...d.data()};
    if(!S.me.branches) S.me.branches=[];
    $("#hdr").hidden=false; $("#app").style.padding=""; $("#app").style.maxWidth=""; $("#appname").textContent=C.appName||"ตรวจป้าย";
    $("#who").textContent=`${S.me.name||email} · ${ROLE_TH[S.me.role]||""}${S.me.zoneId?" · "+S.me.zoneId:S.me.rmId?" · "+S.me.rmId:""}`;
    $("#app").innerHTML='<div class="empty-state">กำลังโหลดข้อมูล…</div>';
    await loadAll(); BOOTED=true;
    if((S.me.role==="branch"||S.me.role==="manager")&&S.me.branches.length===1&&!location.hash.replace(/^#\/?/,"")) return go("branch/"+S.me.branches[0]);
    render();
  }catch(e){ console.error(e); const m=String(e.message||e);
    const hint=/permission|insufficient/i.test(m)?"สิทธิ์ไม่ผ่าน: ตรวจว่า Gmail ใน firestore.rules และ config.js (superAdmins) ตรงกับ Gmail ที่ล็อกอิน และกด Publish Rules แล้ว"
      :/offline|unavailable|failed to get/i.test(m)?"เชื่อมต่อฐานข้อมูลไม่ได้: ตรวจว่าสร้าง Firestore Database แล้ว และชื่อฐานข้อมูลเป็น (default)":"";
    viewLogin(`โหลดข้อมูลไม่สำเร็จ: ${esc(m)}${hint?`<p><b>${hint}</b></p>`:""}<div style="margin-top:8px"><button onclick="auth.signOut()">ออกจากระบบ</button></div>`); }
});
</script>
